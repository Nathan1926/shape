  guest.p[r.ax] = (r.sgn > 0 ? h.max[r.ax] + half : h.min[r.ax] - half);
  // along: the fraction he welded at
  AX.forEach(x => {
    if (x === r.ax) return;
    guest.p[x] = h.min[x] + r.f[x] * (h.max[x] - h.min[x]);
  });
  guest.mesh.position.copy(guest.p);
}

function cloneRel(r) { return r && { ax:r.ax, sgn:r.sgn, f:Object.assign({}, r.f) }; }

// ⭐ WALK OUTWARD FROM WHAT HE CHANGED. The head moves the handle; if something
//    is welded to the handle it moves too, and it is the same loop. ⛔ Each
//    shape is placed ONCE - a second visit would fight the first.
function holdWelds(changed) {
  const seed = SHAPES.indexOf(changed);
  if (seed < 0) return;
  const done = new Set([seed]);
  const queue = [seed];
  while (queue.length) {
    const a = queue.shift();
    WELDS.forEach(w => {
      const o = w[0] === a ? w[1] : (w[1] === a ? w[0] : -1);
      if (o < 0 || done.has(o)) return;
      const host = SHAPES[a], guest = SHAPES[o];
      if (host && guest && w.r) placeByRel(host, guest, w.r[w[0] === a ? 1 : 0]);
      done.add(o);
      queue.push(o);
    });
  }
  refreshWelds();
}

function weldDrop(sh) {
  const me = SHAPES.indexOf(sh);
  if (me < 0) return 'nothing there';
  const held = WELDS.some(([i, j]) => i === me || j === me);
  if (held) {
    for (let k = WELDS.length - 1; k >= 0; k--) {
      if (WELDS[k][0] === me || WELDS[k][1] === me) WELDS.splice(k, 1);
    }
    return 'let go';
  }
  let n = 0;
  SHAPES.forEach((o, j) => {
    if (o === sh || !touching(sh, o)) return;
    // ⭐ BOTH DIRECTIONS, because either one of them can be the one he grabs.
    //    f[0] is where SHAPES[i] sits inside SHAPES[j]; f[1] the reverse.
    const pair = [me, j];
    pair.r = [relOf(o, sh), relOf(sh, o)];
    WELDS.push(pair); n++;
  });
  return n ? ('welded to ' + n) : 'not touching anything';
}

// ══ UNDO ═════════════════════════════════════════════════════════════════
// ⛔⛔ RUNG ZERO, AND HE PAID FOR IT BEFORE I BUILT IT. 2026-08-20: *"I totally
//    blew the bottom circle out... as big as the base of the Egyptian pyramids,
//    and I had to start over because I couldn't back out of it."*
// ⭐ ONE PUSH PER DRAG, TAKEN BEFORE THE DRAG STARTS. A pull is one move no
//    matter how many frames his hand was down; undoing a single frame would be
//    worse than having no undo at all.
const past = [];
const PAST_MAX = 40;
// ⭐ THE COUNT IS PART OF THE STATE. Without it, undoing a drop would leave
//    the shape sitting there with its old numbers - which looks exactly like
//    undo not working, and is worse than undo not existing.
// ⛔ AND THE WELDS ARE PART OF THE STATE TOO. A weld he could not undo would
//    be the pyramid bug again wearing a different hat: an act with no way back.
function snapshot() {
  past.push({
    shapes: SHAPES.map(sh => sh.kind === 'box'
      ? { kind:'box', p:sh.p.clone(), s:sh.s.clone(), neg:!!sh.neg,
          q:(sh.q || IDQ).clone() }
      : { kind:'cyl', p:sh.p.clone(), axis:sh.axis, h:sh.h, neg:!!sh.neg,
          a0:sh.a0, b0:sh.b0, a1:sh.a1, b1:sh.b1, q:(sh.q || IDQ).clone() }),
    welds: WELDS.map(w => {
      const c = w.slice();
      if (w.r) c.r = w.r.map(cloneRel);
      return c;
    }),
  });
  if (past.length > PAST_MAX) past.shift();
}
function undo() {
  const step = past.pop();
  if (!step) return;
  const was = step.shapes;
  while (SHAPES.length > was.length) {          // a drop is undone by removing it
    const gone = SHAPES.pop();
    scene.remove(gone.mesh);
    if (gone.wall) scene.remove(gone.wall);
    gone.mesh.geometry.dispose();
  }
  WELDS.length = 0;
  step.welds.forEach(w => {
    const c = w.slice();
    if (w.r) c.r = w.r.map(cloneRel);         // ⛔ the relationship IS the weld
    WELDS.push(c);
  });
  was.forEach((w, i) => {
    const sh = SHAPES[i];
    sh.p.copy(w.p);
    sh.neg = !!w.neg;
    if (w.q) { if (!sh.q) sh.q = new THREE.Quaternion(); sh.q.copy(w.q); }
    if (sh.kind === 'box') sh.s.copy(w.s);
    else { sh.h = w.h; sh.a0 = w.a0; sh.b0 = w.b0; sh.a1 = w.a1; sh.b1 = w.b1; }
    rebuild(sh);
  });
  refreshWelds();
  syncCuts();
  dropTool();                 // ⛔ undo cannot leave a tool half-used in his hand
  ghost.visible = false;
  hideDim();
  showHandles(null);
  showHook(null);
}
addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { dropTool(); return; }
  if (!e.ctrlKey && !e.metaKey && !e.altKey && e.key.toLowerCase() === 'h') {
    toggleCuts();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
    e.preventDefault();
    undo();
  }
});

const cv = renderer.domElement;

// ══ PAN ══════════════════════════════════════════════════════════════════
// ⭐⭐ JOE, 2026-08-20, unprompted and mid-build: *"right-click and hold and
//    drag is pan in SolidWorks and others. I keep doing it. That means my
//    right finger is connected to my brain in that way."*
//
// ⭐⭐ THAT IS THE STRONGEST KIND OF SPEC THERE IS, AND IT OUTRANKS MY TASTE.
//    He is not asking for a feature; he is reporting that his hand already
//    does it. A tool that ignores twenty years of muscle memory does not feel
//    neutral to him, it feels WRONG - which is the exact thing this whole
//    build is measured against: "it does not fight me."
//
// ⛔ AND IT DOES NOT BREAK THE ONE RULE. The rule is about the LEFT hand -
//    drag ON a shape shapes it, drag OFF it turns the view. The right button
//    was unused and carries no meaning yet, so spending it costs nothing and
//    adds no mode: nothing is held, nothing is armed, nothing is remembered.
//
// ⭐ WHAT PAN ACTUALLY MOVES is what he orbits around, not the camera. Keeping
//    those the same thing is why double-tap-to-look and pan agree with each
//    other instead of fighting - pan slides the pivot, and the camera follows
//    it like it always has.
let panning = null;
const PAN_R = new THREE.Vector3(), PAN_U = new THREE.Vector3(), PAN_F = new THREE.Vector3();

cv.addEventListener('contextmenu', (e) => e.preventDefault());

function panBy(e) {
  // ⭐ pixels to millimetres AT THE PIVOT'S DEPTH, so the model stays under his
  //    finger whether he is nose-in on a bead or looking at the whole thing.
  const per = 2 * Math.tan(camera.fov * Math.PI / 360) * orbit.dist / innerHeight;
  camera.matrixWorld.extractBasis(PAN_R, PAN_U, PAN_F);
  const move = PAN_R.clone().multiplyScalar(-(e.clientX - panning.x) * per)
                .add(PAN_U.clone().multiplyScalar((e.clientY - panning.y) * per));
  pivot.add(move);
  pivotWant.add(move);                  // ⛔ both, or the ease drags it back
  if (spot.visible) spot.position.add(move);
  panning.x = e.clientX; panning.y = e.clientY;
}

// ⭐ One path for mouse and finger - a dblclick handler would leave touch out,
//    and touch is where he actually works.
let lastTap = 0, lastXY = [0,0];
function lookHere(e) {
  const h = handleUnder(e);
  if (h) {
    pivotWant.copy(h.point);
    spot.position.copy(h.point);
    spot.scale.setScalar(Math.max(0.8, radius() * 0.018));
    spot.visible = true;
  } else {
    bounds().getCenter(pivotWant);
    spot.visible = false;
  }
}

cv.addEventListener('pointerdown', (e) => {
  // ⛔ FIRST, BEFORE THE TAP CLOCK. A right-click is not a tap, and letting it
  //    set lastTap would make his next left-click read as a double-tap.
  if (e.button === 2) {
    e.preventDefault();
    cv.setPointerCapture(e.pointerId);
    panning = { x:e.clientX, y:e.clientY };
    return;
  }
  // ⛔⛔ THE BUG HIS HANDS FOUND, 2026-08-20: *"the mate faces don't survive me
  //    trying to rotate the view. As soon as I click the metal button or try to
  //    pan or anything, the mate surface unselects."*
  //    I had written "any other touch puts the tool down" and called it a cheap
  //    escape. ⛔ IT IS NOT AN ESCAPE, IT IS A TRAP - the one thing he must do
  //    between picking two faces is LOOK AROUND, and looking around threw the
  //    work away. Mating two faces you cannot both see at once is the normal
  //    case, not the edge case.
  // ⭐ SO: while the tool is held, a press starts nothing and cancels nothing.
  //    Orbit freely. Only a real CLICK on a face counts, and only the button or
  //    Escape puts the tool down.
  // ⭐ HIS OWN CORRECTION NAILED IT: *"the mate selected face survives pan, just
  //    not rotate... I go to use the center button to rotate, the scroll wheel
  //    to rotate. It doesn't rotate, and the selected face deselects."*
  //    Pan lived because the right button is handled above this. Rotate died
  //    because it fell into here. ⛔ THE MIDDLE BUTTON IS HIS ROTATE - same as
  //    SolidWorks - so it must turn the view and never count as a pick.
  if (mateHeld || turnHeld) {
    e.preventDefault();
    cv.setPointerCapture(e.pointerId);
    turning = { x:e.clientX, y:e.clientY, from:[e.clientX, e.clientY], btn:e.button };
    return;
  }

  const now = performance.now();
  const near = Math.hypot(e.clientX-lastXY[0], e.clientY-lastXY[1]) < 24;
  if (now - lastTap < 320 && near) {
    lastTap = 0;
    lookHere(e);
    return;                       // ⛔ a look is not a grab
  }
  lastTap = now; lastXY = [e.clientX, e.clientY];

  cv.setPointerCapture(e.pointerId);
  const h = handleUnder(e);
  if (h) { snapshot(); beginDrag(h); showGhost(h); showDim(h); }
  else   { turning = { x:e.clientX, y:e.clientY }; }
});

cv.addEventListener('pointermove', (e) => {
  if (panning) { panBy(e); return; }
  if (turnHeld && !turning) { const h = handleUnder(e); showTurnPreview(h && h.sh); return; }
  if (mateHeld && !turning) { showPreview(faceOf(handleUnder(e))); return; }
  if (drag) { moveDrag(e); return; }
  if (turning) {
    orbit.yaw   -= (e.clientX - turning.x) * 0.008;
    orbit.pitch += (e.clientY - turning.y) * 0.008;
    orbit.pitch  = Math.max(-1.45, Math.min(1.45, orbit.pitch));
    turning.x = e.clientX; turning.y = e.clientY;
    return;
  }
  const h = handleUnder(e);
  showGhost(h && h.type !== 'move' ? h : null);
  showHook(h ? h.sh : null);
  // ⭐ The beads appear when his hand is near the thing they belong to, and
  //    go away when it is not. Always-on beads are clutter; never-on beads are
  //    a feature nobody finds.
  showHandles(h && h.sh.kind === 'cyl' ? h.sh : null);
});

function release(e) {
  try { cv.releasePointerCapture(e.pointerId); } catch (_) {}

  // ⭐ A CLICK IS A PRESS THAT DID NOT TRAVEL. Judging it on release is what
  //    lets him orbit by dragging from anywhere - including from ON a shape -
  //    without ever picking a face he did not mean.
  if (turnHeld && turning && turning.from) {
    const still = Math.hypot(e.clientX - turning.from[0], e.clientY - turning.from[1]) < 6;
    const wasLeft = turning.btn === 0;
    turning = null;
    if (still && wasLeft) {
      const h = handleUnder(e);
      // ⛔ the hook sits at the centre of the body and would swallow the click,
      //    so read the shape, not the handle he happened to land on
      if (h && h.sh) { snapshot(); quarterTurn(h.sh, viewAxis()); showTurnPreview(h.sh); }
    }
    drag = null; panning = null;
    return;
  }

  if (mateHeld && turning && turning.from) {
    const still = Math.hypot(e.clientX - turning.from[0], e.clientY - turning.from[1]) < 6;
    const wasLeft = turning.btn === 0;      // ⛔ only the left button picks
    turning = null;
    if (still && wasLeft) {
      const f = faceOf(handleUnder(e));
      if (f) {
        if (!mateA) { mateA = f; markFace(f); }
        else if (f.sh !== mateA.sh) { snapshot(); doMate(mateA, f); dropTool(); }
      }
    }
    drag = null; panning = null;
    return;
  }
  drag = null; turning = null; panning = null;
  hideDim();
  snapLines.visible = false;   // ⭐ the proposal is gone once he has decided                      // ⭐ the ruler exists only while he is pulling
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);

cv.addEventListener('wheel', (e) => {
  e.preventDefault();
  orbit.dist = Math.max(40, Math.min(3000, orbit.dist * (1 + Math.sign(e.deltaY)*0.1)));
  framing = orbit.dist / framingRadius();      // he just told us what size he wants
}, { passive:false });

let pinch = null;
cv.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinch = { d: Math.hypot(dx,dy), dist: orbit.dist };
  }
}, { passive:true });
cv.addEventListener('touchmove', (e) => {
  if (pinch && e.touches.length === 2) {
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const d = Math.hypot(dx,dy);
    if (d > 4) {
      orbit.dist = Math.max(40, Math.min(3000, pinch.dist * (pinch.d / d)));
      framing = orbit.dist / framingRadius();
    }
  }
}, { passive:true });
cv.addEventListener('touchend', () => { pinch = null; }, { passive:true });

// ══ VR ══════════════════════════════════════════════════
// ⭐⭐ JOE, after a night of it flat: *"it was only about as good as it was
//    w the mouse."* Of course it was - a window in front of your face is
//    still a window.
// ⛔ AND THE TRADE HAS TO BE SAID OUT LOUD: PRECISION IN HERE IS WORSE THAN
//    A MOUSE AND ALWAYS WILL BE. That is exactly why THIS tool belongs in
//    goggles and SolidWorks does not. What comes back is reach, depth, and a
//    hand that goes where you point it - and this is a tool for THINKING in
//    shapes, where near enough is the whole point.
renderer.xr.enabled = true;

const VRB = document.getElementById('vr');

// ⭐ the button only exists if the browser can actually do it. On the desktop
//    it never appears, so nothing on the bench changes.
if (navigator.xr && navigator.xr.isSessionSupported) {
  navigator.xr.isSessionSupported('immersive-vr').then(ok => {
    if (ok) VRB.style.display = 'block';
  }).catch(() => {});
}

VRB.addEventListener('click', async () => {
  if (renderer.xr.isPresenting) { renderer.xr.getSession().end(); return; }
  try {
    const session = await navigator.xr.requestSession('immersive-vr', {
      optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking']
    });
    renderer.xr.setReferenceSpaceType('local-floor');
    await renderer.xr.setSession(session);
  } catch (err) {
    // ⛔ say WHY out loud rather than doing nothing and looking broken
    VRB.textContent = 'VR REFUSED: ' + (err && err.message ? err.message : err);
  }
});

// ⭐⭐ THE SCALE IS THE WHOLE COMFORT OF IT. A part here is hundreds of units
//    across and a man is 1.6 metres, so the rig is scaled to bring the part
//    to about arm's reach. Read it off the ACTUAL bounds and it works the
//    same for a bracket or a bridge.
// ⭐⭐ JOE: *"I feel like a lobster."* A laser pointer held at arm's length is
//    a mouse with extra steps, and the part being across the room is what
//    FORCES the laser. So the part comes to him instead: about the size of a
//    melon, floating where his hands already are. Then reaching for it is
//    just reaching for it.
// ⚠️ AND HE CAN CHANGE IT - both hands pinched, pull apart to grow the world,
//    together to shrink it, drag to slide it. See worldGrab().
// ⛔⛔ JOE: *"the shapes are totally gone now. I'm actually in total
//    blackness."* BOTH HALVES OF THAT ARE MINE.
//    I put the part along the ROOM's axis - whichever way the guardian was
//    drawn - instead of along his nose. Face the other way and it is behind
//    him. And I had just taken the grid away, so behind him meant a void with
//    nothing in it at all. One mistake was survivable; together they are a
//    black screen.
// ⭐ SO PLACE IT OFF HIS ACTUAL HEAD POSE, and do it on the first frame INSIDE
//    the session - at sessionstart the headset has not reported where he is
//    yet, which is the trap that made the first version look correct.
let needPlace = false;
const HEADW = new THREE.Vector3(), HEADL = new THREE.Vector3();
const FWDW = new THREE.Vector3(), FWDL = new THREE.Vector3();
const TARG = new THREE.Vector3(), QINV = new THREE.Quaternion();
const PQ = new THREE.Quaternion();

function placeRig() {
  // ⛔⛔ JOE: *"the green laser points right at my eyeballs. So I think the
  //    model is living in my head."* It was. Three tries, three different
  //    wrong answers, all from the SAME mistake: I kept working out where his
  //    head was by reading the CAMERA, whose world matrix is the rig matrix
  //    times the head pose - and I had just changed the rig scale on the line
  //    above. I was measuring with a ruler I was still bending.
  // ⭐⭐ SO STOP ASKING THE CAMERA AND ASK THE HEADSET. The viewer pose comes
  //    straight out of the frame in plain metres, in the room's own space,
  //    and it does not know or care what the rig is doing. No inverse
  //    rotations, no dividing by a scale I just set, nothing to get stale.
  const frame = renderer.xr.getFrame();
  const ref = renderer.xr.getReferenceSpace();
  if (!frame || !ref) return false;
  const pose = frame.getViewerPose(ref);
  if (!pose) return false;                    // ⭐ no pose, no placing. Try again.

  const b = bounds();
  const c = b.getCenter(new THREE.Vector3());
  const r = Math.max(b.getBoundingSphere(new THREE.Sphere()).radius, 1);
  const S = r / 0.3;                          // the part reads about 0.6 m across

  const t = pose.transform.position;
  const o = pose.transform.orientation;
  HEADL.set(t.x, t.y, t.z);                   // metres, in the room
  PQ.set(o.x, o.y, o.z, o.w);
  FWDL.set(0, 0, -1).applyQuaternion(PQ);
  FWDL.y = 0;
  if (FWDL.lengthSq() < 1e-6) FWDL.set(0, 0, -1);
  FWDL.normalize();

  // three quarters of a metre down his line of sight, a touch below eye level
  TARG.copy(HEADL).addScaledVector(FWDL, 0.75);
  TARG.y -= 0.12;

  // ⭐ the rig is now just: metres times S, then shifted. Nothing else.
  xrRig.quaternion.identity();
  xrRig.scale.setScalar(S);
  xrRig.position.copy(c).sub(TARG.multiplyScalar(S));
  xrRig.updateMatrixWorld(true);
  return true;
}

renderer.xr.addEventListener('sessionstart', () => {
  VRB.textContent = 'LEAVE VR';
  // ⭐⭐ JOE: *"I think I'd prefer nothing at all to the grid."* Agreed, and
  //    there is a reason it stops earning its keep in there. The grid exists
  //    because a solid floating in a void has no depth cue ON A FLAT SCREEN.
  //    In a headset he has two eyes and parallax, so the depth arrives for
  //    free and the grid is just a floor that is not really there.
  // ⛔ It comes straight back when he takes them off, where it is still doing
  //    a job.
  grid.visible = false;

  // ⛔⛔ JOE: *"they come a little closer, maybe a little bit, but they
  //    disappear a lot, and I can't get very much closer."* THAT IS A WALL OF
  //    GLASS ONE METRE FROM HIS FACE AND I PUT IT THERE.
  // ⚠️ The near plane is 1 - which on the desktop means one WORLD UNIT, a
  //    millimetre of a part. In a headset the same number is handed to the
  //    device as DEPTH IN METRES. So everything within a metre of his eyes
  //    was clipped away, and pulling a shape closer deleted it. The number
  //    never changed; the units under it did.
  // ⭐ Two centimetres in there, so he can bring a part right up to his nose.
  // ⚠️ 0.02 to 2000 is a hundred-thousand-to-one depth range and the buffer
  //    cannot hold it - which is what ate the backs of his shapes. Two
  //    centimetres to two hundred metres is plenty for a part at arm's length
  //    and keeps the precision where he is looking.
  camera.near = 0.02;
  camera.far = 200;
  camera.updateProjectionMatrix();

  needPlace = true;          // ⛔ not now - on the first frame, when he exists
});

renderer.xr.addEventListener('sessionend', () => {
  VRB.textContent = 'ENTER VR';
  grid.visible = true;
  camera.near = 1;                 // back to world units for the flat screen
  camera.far = 6000;
  camera.updateProjectionMatrix();
  xrRig.position.set(0, 0, 0);
  xrRig.quaternion.identity();
  xrRig.scale.setScalar(1);
  grabbed = [null, null];
});

// ══ HANDS ═══════════════════════════════════════════════
// ⛔ GETTING IN WITHOUT HANDS WOULD BE WORSE THAN THE MOUSE, NOT BETTER - he
//    would be a statue in there. Point and squeeze moves a shape, and a hole
//    moves exactly like a solid, because it IS one.
let grabbed = [null, null];
const XRM = new THREE.Matrix4(), XRR = new THREE.Raycaster(), XRP = new THREE.Vector3();
const controllers = [0, 1].map(i => {
  const c = renderer.xr.getController(i);
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-1)]),
    new THREE.LineBasicMaterial({ color:0xffb37a }));
  line.scale.z = 6;                                  // six metres of reach
  c.add(line);
  xrRig.add(c);                                      // inherits the rig's scale

  c.addEventListener('selectstart', () => {
    XRM.identity().extractRotation(c.matrixWorld);
    XRR.ray.origin.setFromMatrixPosition(c.matrixWorld);
    XRR.ray.direction.set(0, 0, -1).applyMatrix4(XRM).normalize();
    const hit = XRR.intersectObjects(pickable(), false)[0];
    if (!hit) return;
    const sh = hit.object.userData.shape;
    if (!sh) return;
    snapshot();                                      // undo still works in here
    XRP.setFromMatrixPosition(c.matrixWorld);
    grabbed[i] = { sh, off: sh.p.clone().sub(XRP) };
  });

  c.addEventListener('selectend', () => { grabbed[i] = null; });
  // ⭐ THE WAY HOME. Squeeze the grip and the part comes back to your face,
  //    whichever way you have wandered off to.
  c.addEventListener('squeezestart', () => { needPlace = true; });
  return c;
});

// ⭐ RIGHT STICK UP AND DOWN PUSHES A HELD SHAPE OUT AND REELS IT IN. With a
//    laser, the thing you grabbed stays at the distance you grabbed it, which
//    is exactly the stuck feeling he described. This is the controller
//    answer; the hand answer is to just walk up and take it.
const XRPUSH = new THREE.Vector3(), XRPM = new THREE.Matrix4();

function pushAxis() {
  const session = renderer.xr.getSession();
  if (!session) return 0;
  for (const src of session.inputSources) {
    if (src.handedness !== 'right') continue;
    const gp = src.gamepad;
    if (gp && gp.axes.length >= 4 && Math.abs(gp.axes[3]) > 0.15) return gp.axes[3];
  }
  return 0;
}

function carry(dt) {
  let moved = false;
  const push = pushAxis();
  grabbed.forEach((g, i) => {
    if (!g) return;
    if (push) {
      XRPM.identity().extractRotation(controllers[i].matrixWorld);
      XRPUSH.set(0, 0, -1).applyMatrix4(XRPM).normalize();
      g.off.addScaledVector(XRPUSH, -push * 1.4 * xrRig.scale.x * dt);
    }
    XRP.setFromMatrixPosition(controllers[i].matrixWorld);
    g.sh.p.copy(XRP).add(g.off);
    g.sh.mesh.position.copy(g.sh.p);
    if (g.sh.wall) g.sh.wall.position.copy(g.sh.p);
    moved = true;
  });
  if (moved) { syncCuts(); refreshWelds(); }
}

// ══ HANDS ═══════════════════════════════════════════════
// ⭐⭐ HIS FIRST PREFERENCE, AND HE IS RIGHT: *"hands first, if that just
//    doesn't work then we'll go back to using the laser things."*
// ⛔ THE POINT IS NOT THAT HANDS ARE A NICER POINTER. IT IS THAT THEY ARE NOT
//    A POINTER AT ALL. A pointer picks a thing and then you fly it with a
//    stick. A hand goes to where the thing is and closes on it, which is the
//    one motion a mouse has never been able to make - and it is the motion
//    SWEEP is made of.
// ⚠️ HAND TRACKING HAS TO BE ON IN THE HEADSET AND THE CONTROLLERS PUT DOWN.
//    If the joints never arrive, nothing here fires and the controllers still
//    work exactly as before. Nothing is lost by trying.
const PINCH_ON = 0.022, PINCH_OFF = 0.035;      // metres, thumb tip to index tip
const JOINTMAT = new THREE.MeshBasicMaterial({ color:0x9ad1ff });
const PINCHMAT = new THREE.MeshBasicMaterial({ color:0xffb37a });
const JOINTGEO = new THREE.SphereGeometry(1, 8, 6);

const hands = [0, 1].map(i => {
  const h = renderer.xr.getHand(i);
  xrRig.add(h);                                  // ⭐ inherits the rig's scale
  h.userData.pinching = false;
  h.userData.grab = null;
  return h;
});

// ⭐ he has to SEE his hands or he cannot aim them. One dot per joint, sized
//    from the joint's own radius, so it is his hand and not a glove.
// ⛔⛔ BUILD 7 REPORTED "hands 25" - twenty-five joints, arriving, every
//    frame, the whole time. His hands were NEVER missing. I was drawing them
//    at their true anatomical size, 8 mm, in a black void, and calling that
//    showing him his hands.
// ⭐ SO DRAW THEM LIKE A TOOL, NOT LIKE AN X-RAY. Fat bright knuckles, and the
//    two fingers that do the pinching bigger and orange, so the gesture he
//    needs is the most obvious thing on his hand.
const PINCHERS = { 'index-finger-tip':1, 'thumb-tip':1 };
function dressHand(h) {
  for (const name in h.joints) {
    const j = h.joints[name];
    if (!j.userData.dot) {
      j.userData.dot = new THREE.Mesh(JOINTGEO,
        PINCHERS[name] ? PINCHMAT : JOINTMAT);
      j.userData.dot.frustumCulled = false;
      j.add(j.userData.dot);
    }
    const r = Math.max(j.jointRadius || 0.008, 0.008);
    j.userData.dot.scale.setScalar(PINCHERS[name] ? r * 2.6 : r * 1.8);
  }
}

const TIP = new THREE.Vector3(), THU = new THREE.Vector3(), PIN = new THREE.Vector3();

function pinchOf(h) {
  const a = h.joints['index-finger-tip'], b = h.joints['thumb-tip'];
  if (!a || !b) return null;
  // ⛔ MEASURE THE PINCH IN METRES, NOT IN WORLD UNITS. These are local to the
  //    rig, so they stay in metres however far the world is scaled - which is
  //    the whole reason the gesture keeps working when he zooms.
  const gap = a.position.distanceTo(b.position);
  a.getWorldPosition(TIP);
  b.getWorldPosition(THU);
  PIN.addVectors(TIP, THU).multiplyScalar(0.5);
  return { gap, at: PIN.clone(), local: a.position.clone().add(b.position).multiplyScalar(0.5) };
}

// ⭐ CLOSE ON IT, DO NOT AIM AT IT. Nearest shape whose skin is within a few
//    centimetres of the pinch - measured in HIS metres, so the reach does not
//    change when the world does.
const NEARBOX = new THREE.Box3();
function shapeNear(at) {
  const tol = 0.06 * xrRig.scale.x;
  let best = null, bestD = tol;
  SHAPES.forEach(sh => {
    const m = (sh.mesh && sh.mesh.visible) ? sh.mesh
            : (sh.wall && sh.wall.visible) ? sh.wall : null;
    if (!m) return;
    NEARBOX.setFromObject(m);
    const d = NEARBOX.distanceToPoint(at);
    if (d < bestD) { bestD = d; best = sh; }
  });
  return best;
}

// ══ TWO HANDS ═══════════════════════════════════════════
// ⛔⛔ HIS FIELD REPORT KILLED THIS FEATURE AND HE WAS RIGHT TO. Two pinched
//    hands used to drive WORLD SCALE. Three things wrong with that:
//    1. It was a command he could not see. *"any hand movement is a command
//       I can't see."*
//    2. Scaling the world moves the part AND your distance to it by the same
//       factor, so the part never changes apparent size - it just retreats
//       into the far distance until the depth buffer eats it. His words:
//       *"the shapes stay the same apparent size but get progressively sliced
//       away from the back."* That is not a zoom. It is a treadmill.
//    3. It stole the gesture he actually wanted.
//
// ⭐⭐ SO TWO HANDS NOW HOLD THE PART, NOT THE ROOM. Pinch the same shape with
//    both hands and pull apart to make it bigger, together to make it
//    smaller. It grows about the point between your hands, so it stays where
//    you are holding it.
//
// ⚠️ WHAT HE ASKED FOR AND IS NOT HERE: *"if that cube were a cardboard box
//    I'd take a corner in each hand and turn it."* Not today, and not because
//    it is hard to detect. Every shape in this file is stored as axis-aligned
//    numbers - which is exactly the property that lets a hole be subtracted
//    per pixel with three lines of arithmetic instead of a boolean. Free
//    rotation breaks that, and the handles, mate, weld and snap all lean on
//    it too. It is a real job, not a patch, and it should be decided on
//    purpose rather than smuggled in.
let both = null;
const H0 = new THREE.Vector3(), H1 = new THREE.Vector3(), HMID = new THREE.Vector3();
const AXIS0 = new THREE.Vector3(), AXIS1 = new THREE.Vector3();
const DQ = new THREE.Quaternion(), OFFV = new THREE.Vector3();

function sizeOf(sh) {
  return sh.kind === 'box'
    ? { s: sh.s.clone() }
    : { h: sh.h, a0: sh.a0, b0: sh.b0, a1: sh.a1, b1: sh.b1 };
}

function scaleTo(sh, was, k) {
  if (sh.kind === 'box') {
    sh.s.copy(was.s).multiplyScalar(k);
  } else {
    sh.h = was.h * k;
    sh.a0 = was.a0 * k; sh.b0 = was.b0 * k;
    sh.a1 = was.a1 * k; sh.b1 = was.b1 * k;
  }
}

function twoHands(pa, pb) {
  const live = pa && pb && pa.gap < PINCH_OFF && pb.gap < PINCH_OFF;
  if (!live) { both = null; return false; }

  H0.copy(pa.at); H1.copy(pb.at);
  const span = Math.max(H0.distanceTo(H1), 1e-4);
  HMID.addVectors(H0, H1).multiplyScalar(0.5);

  if (!both) {
    if (pa.gap > PINCH_ON || pb.gap > PINCH_ON) return false;
    // both hands must be closing on the SAME shape, or this is not a grab
    const sa = shapeNear(pa.at), sb = shapeNear(pb.at);
    if (!sa || sa !== sb) return false;
    snapshot();
    if (!sa.q) sa.q = new THREE.Quaternion();
    both = { sh: sa, span, was: sizeOf(sa), p0: sa.p.clone(), mid: HMID.clone(),
             axis: AXIS1.copy(H1).sub(H0).normalize().clone(), q0: sa.q.clone() };
    return true;
  }

  const k = THREE.MathUtils.clamp(span / both.span, 0.15, 8);
  scaleTo(both.sh, both.was, k);

  // ⭐⭐ THE CARDBOARD BOX. The line between his two hands IS the handle - point
  //    that line somewhere else and the shape points somewhere else. No
  //    gizmo, no axis to pick, no mode: the thing turns because he turned his
  //    hands, which is what he said in the first place.
  // ⚠️ THIS IS SWING, NOT ROLL. Twisting both wrists about the line between
  //    them does nothing yet - that needs the hands' own orientation and it
  //    is a separate job. Said out loud rather than left for him to find.
  AXIS0.copy(both.axis);
  AXIS1.copy(H1).sub(H0);
  if (AXIS1.lengthSq() > 1e-8) {
    AXIS1.normalize();
    DQ.setFromUnitVectors(AXIS0, AXIS1);
    both.sh.q.copy(DQ).multiply(both.q0);
  }

  // ⭐ it grows and turns ABOUT THE POINT BETWEEN HIS HANDS, so it stays where
  //    he is holding it instead of swinging away from him.
  OFFV.copy(both.p0).sub(both.mid).multiplyScalar(k).applyQuaternion(DQ);
  both.sh.p.copy(HMID).add(OFFV);

  rebuild(both.sh);
  handMoved = true;
  return true;
}

function handsUpdate() {
  const p = [pinchOf(hands[0]), pinchOf(hands[1])];
  hands.forEach(dressHand);
  // ⛔ a hand with joints is not a laser. Take the beam off it.
  hands.forEach((h, i) => {
    const ray = controllers[i].children[0];
    if (ray) ray.visible = Object.keys(h.joints).length === 0;
  });

  // ⭐ the way home, and it is a thing he can SEE and touch
  if (resetPoked(p)) return;

  const holdingBoth = twoHands(p[0], p[1]);
  if (holdingBoth) {
    hands.forEach(h => { h.userData.grab = null; h.userData.pinching = true; });
    return;
  }

  hands.forEach((h, i) => {
    const q = p[i];
    if (!q) { h.userData.pinching = false; h.userData.grab = null; return; }

    if (!h.userData.pinching && q.gap < PINCH_ON) {
      h.userData.pinching = true;
      const sh = shapeNear(q.at);
      if (sh) { snapshot(); h.userData.grab = { sh, off: sh.p.clone().sub(q.at) }; }
    } else if (h.userData.pinching && q.gap > PINCH_OFF) {
      h.userData.pinching = false;      // ⭐ let go wider than you grab, or it
      h.userData.grab = null;           //    drops things by itself
    }

    const g = h.userData.grab;
    if (!g) return;
    g.sh.p.copy(q.at).add(g.off);
    g.sh.mesh.position.copy(g.sh.p);
    if (g.sh.wall) g.sh.wall.position.copy(g.sh.p);
    handMoved = true;
  });
}

let handMoved = false;

// ══ THE READOUT ═════════════════════════════════════════
// ⭐⭐ I HAVE BEEN GUESSING ABOUT HIS HANDS FROM THE OUTSIDE AND I CANNOT SEE
//    IN THERE. So the page says what it actually received - how many input
//    sources, what kind, and whether any of them carry joints. A zero is
//    ambiguous; a census is not.
// ⭐ It also proves the loop is alive. If he can read this, the black screen
//    was never a crash.
const HUDC = document.createElement('canvas');
HUDC.width = 640; HUDC.height = 320;
const HUDX = HUDC.getContext('2d');
const HUDT = new THREE.CanvasTexture(HUDC);
const HUD = new THREE.Mesh(
  new THREE.PlaneGeometry(0.34, 0.17),
  new THREE.MeshBasicMaterial({ map:HUDT, transparent:true, depthTest:false }));
HUD.renderOrder = 999;
HUD.visible = false;
// ⛔⛔ I HUNG THIS ON THE CAMERA IN BUILD 8 BECAUSE IT WAS TIDIER, AND HE
//    STOPPED SEEING IT. In build 7 he read it out to me - "hands 25" - so the
//    world-space version DEMONSTRABLY WORKED and the tidy one demonstrably
//    did not.
// ⭐ PUT BACK WHAT WAS WORKING. The stale-matrix worry was real for the PART,
//    which is placed once on the first frame; it is not a problem for a thing
//    repositioned every frame, where one frame behind is invisible to a human.
//    I changed a working thing to fix a bug it did not have.
scene.add(HUD);

// ══ THE WAY HOME ════════════════════════════════════════
// ⭐⭐ HIS FIRST ASK: *"a reset - one gesture or button that puts the world
//    back to arm's length, because grab only becomes usable at one particular
//    scale and I had to find it by accident."*
// ⛔ A GESTURE WOULD BE ANOTHER INVISIBLE COMMAND, which is the exact thing he
//    just told me off for. So it is a PLATE. He can see it, he pinches it,
//    the part comes back to his hands. Nothing to remember.
const RSTC = document.createElement('canvas');
RSTC.width = 256; RSTC.height = 128;
const RX = RSTC.getContext('2d');
RX.fillStyle = '#16222c'; RX.fillRect(0, 0, 256, 128);
RX.strokeStyle = '#9ad1ff'; RX.lineWidth = 3; RX.strokeRect(3, 3, 250, 122);
RX.fillStyle = '#9ad1ff'; RX.font = '700 40px ui-monospace, monospace';
RX.fillText('RESET', 52, 78);
const RESET = new THREE.Mesh(
  new THREE.PlaneGeometry(0.10, 0.05),
  new THREE.MeshBasicMaterial({ map:new THREE.CanvasTexture(RSTC),
                                transparent:true, depthTest:false }));
RESET.renderOrder = 999;
RESET.visible = false;
RESET.frustumCulled = false;
scene.add(RESET);

let resetArmed = true;
function resetPoked(p) {
  if (!RESET.visible) return false;
  const hit = p.some(q => q && q.gap < PINCH_ON
                       && q.at.distanceTo(RESET.position) < 0.07 * xrRig.scale.x);
  if (!hit) { resetArmed = true; return false; }
  if (!resetArmed) return true;
  resetArmed = false;
  needPlace = true;
  return true;
}

let hudNext = 0;
const HUDPOS = new THREE.Vector3(), HUDF = new THREE.Vector3(), HUDQ = new THREE.Quaternion();
const TETHC = new THREE.Vector3(), TETHV = new THREE.Vector3();
const TETH = new THREE.Line(
  new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]),
  new THREE.LineBasicMaterial({ color:0x7dff9a, depthTest:false }));
TETH.renderOrder = 998;
TETH.frustumCulled = false;
TETH.visible = false;
scene.add(TETH);

function hudLines() {
  const out = [];
  const session = renderer.xr.getSession();
  const srcs = session ? Array.from(session.inputSources) : [];
  out.push('BUILD 12  sources ' + srcs.length
           + '   scale ' + xrRig.scale.x.toFixed(0) + '   near ' + camera.near);
  srcs.forEach(src => {
    out.push('  ' + (src.handedness || '?') + '  ' + (src.targetRayMode || '?')
             + '  hand:' + (src.hand ? src.hand.size : 'no')
             + '  pad:' + (src.gamepad ? src.gamepad.axes.length : 'no'));
  });
  hands.forEach((h, i) => {
    out.push('  hand' + i + ' joints ' + Object.keys(h.joints).length
             + '  seen:' + (h.visible ? 'yes' : 'no'));
  });
  out.push('shapes ' + SHAPES.length + '   cutters '
           + SHAPES.filter(x => x.neg).length
           + (needPlace ? '   PLACING...' : ''));

  // ⭐ BEING LOST SHOULD BE A NUMBER, NOT A MYSTERY. Where the part is from
  //    where he is standing, in metres and in degrees off his nose.
  const cam = renderer.xr.getCamera();
  if (cam.cameras && cam.cameras.length) {
    const c = bounds().getCenter(HUDPOS);
    const eye = new THREE.Vector3().setFromMatrixPosition(cam.matrixWorld);
    const to = c.clone().sub(eye);
    const S = Math.max(xrRig.scale.x, 1e-6);
    cam.getWorldDirection(HUDF);
    HUDF.y = 0; HUDF.normalize();
    const flat = to.clone(); flat.y = 0;
    let deg = 0;
    if (flat.lengthSq() > 1e-9) {
      flat.normalize();
      deg = Math.round(THREE.MathUtils.radToDeg(Math.atan2(
        HUDF.x * flat.z - HUDF.z * flat.x, HUDF.x * flat.x + HUDF.z * flat.z)));
    }
    out.push('head ' + HEADL.y.toFixed(2) + ' m   rig '
             + xrRig.position.x.toFixed(0) + ',' + xrRig.position.y.toFixed(0)
             + ',' + xrRig.position.z.toFixed(0));
    // ⛔ HE CAUGHT THIS: *"the field labelled part does not report the part."*
    //    It reported a distance in METRES computed by dividing world units by
    //    a scale that his own hands were changing - so it moved when he moved
    //    his hands and looked like it was tracking the gesture. It was. Now
    //    the scale only changes when the part is re-placed, so the number
    //    means what it says. Labelled REACH, because that is what it is.
    out.push('reach ' + (to.length() / S).toFixed(2) + ' m   turn '
             + Math.abs(deg) + (deg > 0 ? ' left' : ' right')
             + '   ' + (to.y / S > 0.3 ? 'above' : to.y / S < -0.3 ? 'below' : 'level'));
    out.push(both ? 'BOTH HANDS - RESIZING' : '');
  }
  return out;
}

function drawHud() {
  HUDX.clearRect(0, 0, 640, 320);
  HUDX.fillStyle = 'rgba(8,12,16,0.82)';
  HUDX.fillRect(0, 0, 640, 320);
  HUDX.strokeStyle = '#3a4450';
  HUDX.strokeRect(1, 1, 638, 318);
  HUDX.fillStyle = '#9ad1ff';
  HUDX.font = '600 26px ui-monospace, monospace';
  hudLines().slice(0, 9).forEach((t, i) => HUDX.fillText(t, 18, 44 + i * 32));
  HUDT.needsUpdate = true;
}

function hud(now) {
  HUD.visible = true;
  const cam = renderer.xr.getCamera();
  HUDPOS.setFromMatrixPosition(cam.matrixWorld);
  cam.getWorldDirection(HUDF);
  HUDQ.setFromRotationMatrix(cam.matrixWorld);
  const S = xrRig.scale.x;
  HUD.position.copy(HUDPOS).addScaledVector(HUDF, 0.55 * S);
  HUD.position.y -= 0.22 * S;
  HUD.quaternion.copy(HUDQ);
  HUD.scale.setScalar(S);
  // the plate sits just left of the readout, on the same pane
  RESET.visible = true;
  RESET.quaternion.copy(HUDQ);
  RESET.scale.setScalar(S);
  RESET.position.copy(HUD.position)
       .addScaledVector(new THREE.Vector3(1,0,0).applyQuaternion(HUDQ), -0.24 * S);
  if (now > hudNext) { hudNext = now + 250; drawHud(); }

  // ⭐⭐ THE TETHER, AND IT ENDS BEING LOST FOR GOOD. A bright line from just
  //    under his chin to the middle of the part. It only shows when the part
  //    is off to the side or behind him - so it is never clutter, and when he
  //    is in the dark it is the one thing he can see, and it points.
  const c = bounds().getCenter(TETHC);
  TETHV.copy(c).sub(HUDPOS);
  const off = TETHV.angleTo(HUDF);
  if (off > 0.42 && TETHV.lengthSq() > 1e-9) {
    const pos = TETH.geometry.attributes.position;
    pos.setXYZ(0, HUD.position.x, HUD.position.y, HUD.position.z);
    pos.setXYZ(1, c.x, c.y, c.z);
    pos.needsUpdate = true;
    TETH.geometry.computeBoundingSphere();
    TETH.visible = true;
  } else {
    TETH.visible = false;
  }
}

// ══ WALKING ═════════════════════════════════════════════
// ⭐ left stick slides, right stick turns SMOOTHLY.
// ⚠️⚠️ I BUILT SNAP TURNING FIRST, ON THE STANDARD ARGUMENT THAT A SMOOTH SPIN
//    IS WHAT MAKES PEOPLE SICK. He overruled it, and his reasoning is better
//    than mine was: *"I'd rather take the chance of being made sick... I like
//    the feeling of the reality of moving forward."*
// ⭐ THE STANDARD ARGUMENT IS ABOUT A POPULATION AND HE IS ONE MAN WHO HAS
//    NEVER BEEN MOTION SICK. A rule written for strangers should not outrank
//    the only person who is going to wear this. Off in one line if he is
//    wrong: set SMOOTH_TURN to false.
const XRF = new THREE.Vector3(), XRSIDE = new THREE.Vector3(), XRUP = new THREE.Vector3(0,1,0);
const XRQ = new THREE.Quaternion(), XREYE = new THREE.Vector3();
const SMOOTH_TURN = true;         // ⚠️ his call - flip to false for step turns
const TURN_RATE = 1.7;            // radians a second at full stick
let snapped = false;

function turnRig(a) {
  renderer.xr.getCamera().getWorldPosition(XREYE);
  XRQ.setFromAxisAngle(XRUP, a);
  xrRig.position.sub(XREYE).applyQuaternion(XRQ).add(XREYE);
  xrRig.quaternion.premultiply(XRQ);
}

function walk(dt) {
  const session = renderer.xr.getSession();
  if (!session) return;
  for (const src of session.inputSources) {
    const gp = src.gamepad;
    if (!gp || gp.axes.length < 4) continue;
    const ax = gp.axes[2], ay = gp.axes[3];
    if (src.handedness === 'right') {
      if (SMOOTH_TURN) {
        // ⭐ squared, so a small push is a slow look-around and a hard push is
        //    a real turn. A linear stick makes fine aiming impossible.
        if (Math.abs(ax) > 0.12) turnRig(-Math.sign(ax) * ax * ax * TURN_RATE * dt);
      } else if (Math.abs(ax) > 0.7) {
        if (!snapped) { snapped = true; turnRig(-Math.sign(ax) * Math.PI / 6); }
      } else if (Math.abs(ax) < 0.3) snapped = false;
      continue;
    }
    if (Math.abs(ax) < 0.15 && Math.abs(ay) < 0.15) continue;
    renderer.xr.getCamera().getWorldDirection(XRF);
    XRF.y = 0;
    if (XRF.lengthSq() < 1e-6) continue;
    XRF.normalize();
    XRSIDE.crossVectors(XRF, XRUP).normalize();
    const step = 1.6 * xrRig.scale.x * dt;           // 1.6 m/s, in world units
    xrRig.position.addScaledVector(XRF, -ay * step);
    xrRig.position.addScaledVector(XRSIDE, ax * step);
  }
}

// ⛔ setAnimationLoop, NOT requestAnimationFrame - a headset draws on its own
//    clock and rAF is not it. ⚠️ This is also why the page froze whenever the
//    browser pane was hidden: no frames, no rAF, no test.
let last = performance.now();
renderer.setAnimationLoop(() => {
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  if (renderer.xr.isPresenting) {
    if (needPlace && placeRig()) needPlace = false;
    hud(now);
    walk(dt);                                    // sticks, if he is on controllers
    handMoved = false;
    handsUpdate();                               // hands, if he is on hands
    carry(dt);
    if (handMoved) { syncCuts(); refreshWelds(); }
  } else {
    HUD.visible = false;
    RESET.visible = false;
    TETH.visible = false;
    holdFraming();                                   // the desktop path, untouched
    placeCamera();
  }
  renderer.render(scene, camera);
});
</script>
