        drag OFF a shape    -> turn the view
        double-tap a spot   -> that spot becomes what you orbit and zoom around

  ⭐⭐ CAD GIVES YOU NOUNS - extrude, revolve, loft. You must know the noun
     before you can want it. A KID'S TOOLBOX IS VERBS - cut it, bend it,
     squeeze it, stick it together. Joe's framing, and it is the test for every
     future tool: if it needs a name he would have to be taught, it belongs in
     the other program.

  ══ THE SPINE, 2026-08-20 ════════════════════════════════════════════════
  ⛔ WHY THIS REWRITE HAPPENED: the first version was ONE box - six numbers.
     Every rung on the list (toolbox, weld, snap, deform, cut) needs the same
     change first: one shape becomes A LIST of shapes. Starting parallel work
     before that existed would have been five men building parts to five
     different drawings.

  ⭐⭐ A SHAPE IS A HANDFUL OF NUMBERS, NEVER A MESH. The mesh is what you see;
     the numbers are what the thing IS. That is why dragging a face can stay
     honest - you are editing a number, not pushing triangles around.

  ⭐ AND A CONE IS NOT A NEW SHAPE. Joe, 2026-08-20: *"I could grab it and
     squeeze the one end of the cylinder and pull it up, like drawing up a
     cylinder into a cone."* A cone is A CYLINDER WITH TWO RADII. Squeeze one
     end to nothing and you have a point; squeeze it partway and you have a
     truncated cone. Nothing new underneath. DEFORM was the cheapest verb on
     the whole list and it came out of his own hands.

  ⭐ WHAT THEY NOW KNOW ABOUT EACH OTHER: they can SNAP (line up) and WELD
     (agree to travel together). ⛔ WHAT IS STILL FAKED: no cut. Those are the next rungs and each is named below
     with what it costs. ⛔ CUT is the one that kills this representation, and

  ══ THE NEXT RUNGS, DESIGNED IN CONVERSATION 2026-08-20 ═══════════════════
  In order of what it COSTS, not of what sounds good.

  ⭐⭐ 1 · TOOLBOX AND DROP - cheap. ⛔ ON A MOUSE THE TOOLBOX LIVES AT THE
     SCREEN EDGE; IN GOGGLES IT LIVES IN SPACE near the off-hand. Same idea,
     two homes - building the mouse one as if it were the VR one is the error.
     ⭐ AND THE CAROUSEL MUST BE LOADED, NOT INFINITE. It works because tools

  ⭐⭐ 2 · WELD - cheap, AND IT IS WHY THIS REPRESENTATION SURVIVES. Joe: *"a

  ⭐ 3 · SNAP AS A PROPOSAL - his SmartMates instinct. Rough placement is

  ⛔⛔ 4 · CUT - WHERE THIS REPRESENTATION DIES. After a boolean the result is

  ⭐⭐ 5 · SWEEP - THE FEATURE THAT EARNS THE HEADSET. His case: a curved wire
     passage in a printed part - model the void, subtract it. Square section
     gives a square hole, bend the path and the hole bends. ⛔ A path is the
     one thing he cannot draw with a mouse and has said so for months. ⭐ IN
     GOGGLES HE JUST MOVES HIS HAND WHERE THE WIRE GOES. Everything else here
     is merely POSSIBLE with hands; this one is BETTER with them.

  ⛔⛔ 0 · UNDO - AND IT COMES BEFORE ALL OF THEM. Joe, 2026-08-20, after
     reaching for it and finding nothing: *"I know I can just hit the reset on
     this, but make a note to yourself: Control-Z needs to work."*
     ⭐ IT IS A VERB, not a feature - the same test as cut, bend, squeeze. He
     did not have to be taught it and he reached for it without thinking.
     ⭐⭐ AND IT IS CHEAP HERE FOR THE SAME REASON EVERYTHING ELSE IS: a shape
     is a handful of numbers, so undo is keeping the last twenty sets of them.
     Push a copy before each drag STARTS, not after it ends - a drag is one
     move no matter how many frames it took, and undoing a single frame of a
     drag is worse than no undo at all.
     ⚠️ IN GOGGLES IT NEEDS A GESTURE, not a key. Unsolved, and worth solving

  ⛔ 6 · THE KNIFE IS A DOOR, NOT A TOOL. Carving leaves parametric land for
     good - the shape becomes clay and can never be grabbed by a face again.

     knows he is opening.

  ⚠️ WHAT VR ACTUALLY CHANGES, since he has never worn one and asked:
     ⭐ positioning by hand in real depth is genuinely better than a mouse -
       that is what goggles are good at, and most of this list is not it.
     ⚠️ precision is WORSE; hands jitter millimetres. Which is exactly why THIS

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

// ══ THE MODEL ════════════════════════════════════════════════════════════
// ⭐⭐ Numbers, never meshes. A box is a centre and a size. A cylinder is a
//    centre, an axis, a height and TWO radii - which is why a cone needs no
//    new kind. The mesh hanging off each one is only what you look at.
const SHAPES = [
  { kind:'box', p:new THREE.Vector3(-34, 0, 0), s:new THREE.Vector3(52, 34, 40) },
  // ⭐ Each end carries TWO radii. Equal = a circle; different = an ellipse.
  //    Joe, 2026-08-20: *"if I have you put four handles around the
  //    circumference, it gives me an option to turn a cylinder into an
  //    ellipse."* Same finding as the cone - a shape he wanted turned out
  //    not to be a new KIND of shape, only another number.
  { kind:'cyl', p:new THREE.Vector3( 42, 0, 0), axis:'y', h:52,
    a0:20, b0:20, a1:20, b1:20 },
];
const FLOOR = 5;          // nothing may be pushed through itself
const SEG = 48;           // barrel segments - looks round, stays cheap

// ⭐ ONE PLACE KNOWS WHAT A NEW SHAPE LOOKS LIKE. Every future tool in the
//    carousel adds a line here and nothing else changes.
function makeShape(kind, at, size) {
  return kind === 'box'
    ? { kind:'box', p:at.clone(), s:new THREE.Vector3(size, size*0.7, size*0.8) }
    : { kind:'cyl', p:at.clone(), axis:'y', h:size,
        a0:size*0.38, b0:size*0.38, a1:size*0.38, b1:size*0.38 };
}

const scene    = new THREE.Scene();
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
const camera = new THREE.PerspectiveCamera(42, 1, 1, 6000);

// ══ THE RIG ═════════════════════════════════════════════
// ⛔ IN VR YOU DO NOT MOVE THE CAMERA - the headset owns it. You move what
//    the camera is STANDING ON. So the camera gets a parent, and every VR
//    question (where am I, how big is the world, which way am I facing)
//    becomes a question about this one group.
// ⭐ AT REST IT IS THE IDENTITY, so nothing on the desktop changes at all.
const xrRig = new THREE.Group();
xrRig.add(camera);
scene.add(xrRig);

// ⭐ A GROUND GRID IS NOT DECORATION. A solid floating in a void has no depth
//    cue, and "does it fight me" cannot be answered if he cannot tell which
//    way the thing faces. Faint on purpose.
const grid = new THREE.GridHelper(700, 35, 0x2a2f36, 0x1e2228);
grid.position.y = -150;
scene.add(grid);

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xfff4e6, 2.1);
key.position.set(0.6, 1.0, 0.8); scene.add(key);
const rim = new THREE.DirectionalLight(0x9fb6d0, 0.7);
rim.position.set(-0.7, 0.3, -0.6); scene.add(rim);

const MAT = new THREE.MeshStandardMaterial({
  color:0x9aa3ad, roughness:0.62, metalness:0.08 });

// the face under the cursor, drawn as a translucent skin. ⭐ Feedback, not
// polish - without it the first drag is a guess, and a tool you guess at is a
// tool that fights you.
const ghost = new THREE.Mesh(new THREE.PlaneGeometry(1,1),
  new THREE.MeshBasicMaterial({ color:0xffb37a, transparent:true, opacity:0.22,
                                side:THREE.DoubleSide }));
ghost.visible = false; scene.add(ghost);

// ⛔ THREE.CylinderGeometry CANNOT DO THIS. It takes one radius per end, so
//    an end that is 30 one way and 12 the other is not expressible - and
//    scaling the whole mesh only works if both ends share the same ratio,
//    which is exactly the case he will not stay inside. So we build the rings
//    ourselves. Two rings, a skirt between them, a fan in each cap.
// ⭐ It is about forty lines and it removes a whole class of "the library
//    won't let me", which is the wrong reason to tell him no.
function frustum(sh) {
  const a0 = Math.max(sh.a0, 0.001), b0 = Math.max(sh.b0, 0.001);
  const a1 = Math.max(sh.a1, 0.001), b1 = Math.max(sh.b1, 0.001);
  const hy = sh.h / 2;
  const pos = [], idx = [];
  const ring = (a, b, y) => {
    const first = pos.length / 3;
    for (let i = 0; i < SEG; i++) {
      const t = (i / SEG) * Math.PI * 2;
      pos.push(Math.cos(t) * a, y, Math.sin(t) * b);
    }
    return first;
  };
  const bot = ring(a0, b0, -hy);
  const top = ring(a1, b1,  hy);
  for (let i = 0; i < SEG; i++) {
    const j = (i + 1) % SEG;
    idx.push(bot+i, top+i, top+j,  bot+i, top+j, bot+j);
  }
  // caps: a centre vertex and a fan, so the normals come out flat
  // WINDING DECIDES WHICH WAY A FACE LOOKS, and both caps were backwards on
  //    the first try - Joe saw straight down into the cylinder. Checked by
  //    hand rather than guessed: for the TOP fan, (centre, r_j, r_i) gives a
  //    cross product pointing +Y, which is out. The bottom is the mirror.
  const cB = pos.length / 3; pos.push(0, -hy, 0);
  const rB = ring(a0, b0, -hy);
  for (let i = 0; i < SEG; i++) idx.push(cB, rB + i, rB + ((i+1) % SEG));
  const cT = pos.length / 3; pos.push(0,  hy, 0);
  const rT = ring(a1, b1,  hy);
  for (let i = 0; i < SEG; i++) idx.push(cT, rT + ((i+1) % SEG), rT + i);

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function axisVec(a) {
  return a === 'x' ? new THREE.Vector3(1,0,0)
       : a === 'y' ? new THREE.Vector3(0,1,0)
                   : new THREE.Vector3(0,0,1);
}

// ══ CUT ══════════════════════════════════════════════════════════════════
// ⛔⛔ THE DESIGN RECORD CALLED THIS RUNG "WHERE THIS REPRESENTATION DIES", and
//    it was right about the danger and wrong about the only way out.
//    Its reasoning: after a boolean the result is triangles, so there is no
//    number behind a face and PUSH-PULL STOPS WORKING - the thing he likes.
//    Its escape hatch was a feature tree, which it also warned is the same road
//    as a dimension box.
//
// ⭐⭐⭐ THERE IS A THIRD ANSWER AND IT IS THE CHEAPEST THING IN THIS FILE:
//    ⛔ DO NOT COMPUTE THE BOOLEAN. EVER.
//    A hole is a SHAPE THAT IS MARKED NEGATIVE. It keeps its own numbers, sits
//    in the same list as everything else, and can be pushed, pulled, deformed,
//    welded, mated and turned exactly like a solid. Nothing is subtracted.
//    ⭐ THE SUBTRACTION HAPPENS PER PIXEL, AT DRAW TIME: for each fragment of a
//    solid, ask "is this point inside a cutter" and throw the pixel away if it
//    is. Every shape here is axis-aligned and analytic, so that question is
//    three lines of arithmetic - not a mesh operation at all.
//
// ⭐⭐ WHAT THIS BUYS, AND IT IS THE WHOLE RUNG:
//      - the box is still six numbers. Grab its face, it still moves.
//      - the hole is still a cylinder. Grab ITS wall, the hole gets wider.
//      - move the hole and the box heals behind it, with nothing recomputed.
//      - no feature tree, because there is no history to keep. Just two shapes
//        and a minus sign. ⛔ The thing the record feared - a tree he would end
//        up managing - never gets built.
//
// ⚠️ WHAT IT HONESTLY IS NOT: a solid model. There is no mesh with a hole in
//    it, so this cannot be exported to a printer or handed to SolidWorks as
//    geometry. ⭐ THAT IS THE RIGHT TRADE HERE AND IT WAS ALWAYS THE TRADE -
//    this is the tool for THINKING in shapes. When it has to become a real
//    part, that is Mac's job and a different program. The record's "knife is a
//    door" warning stands; this rung just is not that door.
// ⚠️ AND THE OTHER LIMIT, STATED: four cutters at once. Not a law of the
//    technique - a uniform array size, raised by changing one number.
const MAXCUT = 4, MAXSOL = 8;

// ⭐⭐ JOE: *"if that cube were a cardboard box I'd take a corner in each hand
//    and turn it."* I told him the shapes were stored axis-aligned and asked
//    him to work around it. ⛔ SECTION ZERO SAYS THAT IS THE WRONG SIDE OF THE
//    LINE: *the AI holds the model; the human holds imagination and
//    judgment.* He gave me intent and I answered with plumbing.
// ⭐ SO EVERY SHAPE NOW CARRIES A ROTATION, and the cut honours it. The
//    subtraction is still three lines of arithmetic - it just asks the
//    question in the shape's own frame instead of the world's. Turning the
//    point is cheaper than turning the shape.
function emptySlot() {
  return { on:0, kind:0, c:new THREE.Vector3(), h:new THREE.Vector3(),
           ax:1, r0:new THREE.Vector2(1,1), r1:new THREE.Vector2(1,1),
           rot:new THREE.Vector4(0, 0, 0, 1) };
}

// ⭐ ONE SET OF UNIFORM OBJECTS, SHARED BY REFERENCE with every material in the
//    scene. Write to them once and every shape sees it - no per-material loop,
//    no chance of one solid disagreeing with another about where the hole is.
const CUT_U = {
  uNcut:  { value: 0 },
  uNsol:  { value: 0 },
  uCut:   { value: Array.from({ length: MAXCUT }, emptySlot) },
  uSol:   { value: Array.from({ length: MAXSOL }, emptySlot) },
  uWall:  { value: 0 },     // 1 = drawing the inside surface of a hole
};

// ⭐ "inside" for the two kinds we have. A frustum tapers, so the radii are
//    read at the height of the point rather than at an end - which means a hole
//    he has drawn up into a cone cuts a tapered hole, for free.
const CUT_GLSL = `
struct Solid {
  float on; float kind; vec3 c; vec3 h; float ax; vec2 r0; vec2 r1; vec4 rot;
};
// ⭐ turn the POINT into the shape's frame, not the shape into the world's.
vec3 unrot(vec4 q, vec3 v) {
  vec3 u = -q.xyz;                                    // the inverse rotation
  return v + 2.0 * cross(u, cross(u, v) + q.w * v);
}
bool insideOne(Solid s, vec3 p) {
  if (s.on < 0.5) return false;
  vec3 d = unrot(s.rot, p - s.c);
  if (s.kind < 0.5) {
    return all(lessThanEqual(abs(d), s.h));
  }
  float al = s.ax < 0.5 ? d.x : (s.ax < 1.5 ? d.y : d.z);
  float hh = s.h.x;                          // half length along its own axis
  if (abs(al) > hh) return false;
  float t = clamp((al + hh) / (2.0 * hh), 0.0, 1.0);
  vec2 r = mix(s.r0, s.r1, t);
  vec2 q = s.ax < 0.5 ? d.yz : (s.ax < 1.5 ? d.xz : d.xy);
  return dot(q / max(r, vec2(1e-4)), q / max(r, vec2(1e-4))) <= 1.0;
}
// ⛔⛔ JOE: *"it leaves those surfaces behind when the cutting tools
//    intersect."* Right, and here is why. Each hole draws its own wall and
//    keeps it wherever it sits inside SOLID material. It never asked whether
//    it was sitting inside ANOTHER HOLE - and there is no material there, so
//    there is no wall there either. Two crossing holes each left a skin
//    hanging in the other one's empty space.
// ⭐⭐ THE FIX HAS TO EXCLUDE THE WALL'S OWN HOLE or every wall deletes
//    itself - a wall IS its own cutter's surface, so it is "inside" it.
//    Shrinking each cutter by a hair does exactly that with no bookkeeping:
//    a wall sits ON its own boundary, which is OUTSIDE the shrunken copy, and
//    STRICTLY INSIDE any other hole it crosses. No index to track, nothing to
//    keep in step when shapes are added or removed.
// ⚠️ THE COST, STATED: two holes that touch exactly tangent can leave a
//    sliver about this wide. Shapes here are tens of units across.
const float CUTEPS = 0.35;

bool insideShrunk(Solid s, vec3 p) {
  if (s.on < 0.5) return false;
  vec3 d = unrot(s.rot, p - s.c);
  if (s.kind < 0.5) {
    return all(lessThanEqual(abs(d), max(s.h - vec3(CUTEPS), vec3(0.0))));
  }
  float al = s.ax < 0.5 ? d.x : (s.ax < 1.5 ? d.y : d.z);
  float hh = s.h.x - CUTEPS;
  if (hh <= 0.0 || abs(al) > hh) return false;
  float t = clamp((al + hh) / (2.0 * hh), 0.0, 1.0);
  vec2 r = max(mix(s.r0, s.r1, t) - vec2(CUTEPS), vec2(1e-4));
  vec2 q = s.ax < 0.5 ? d.yz : (s.ax < 1.5 ? d.xz : d.xy);
  return dot(q / r, q / r) <= 1.0;
}
uniform Solid uCut[${MAXCUT}];
uniform Solid uSol[${MAXSOL}];
uniform int uNcut;
uniform int uNsol;
uniform float uWall;
varying vec3 vCutPos;
`;

function paintShader(mat) {
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uCut = CUT_U.uCut;
    sh.uniforms.uSol = CUT_U.uSol;
    sh.uniforms.uNcut = CUT_U.uNcut;
    sh.uniforms.uNsol = CUT_U.uNsol;
    // ⛔⛔ THE ONE UNIFORM THAT MUST NOT BE SHARED, AND SHARING IT BROKE THE
    //    HOLE. Everything else here points at the SAME uniform object on
    //    purpose - write once and every shape agrees about where the hole is.
    //    uWall is the opposite: it is the flag that has to DISAGREE between a
    //    solid and the inside of a hole. Shared, it was always 0, so the wall
    //    was told "you are a solid" and discarded itself wherever it sat
    //    inside a cutter - which is EVERYWHERE, because the wall IS the
    //    cutter's own back faces. The hole came out empty instead of walled.
    // ⭐ One object per material. It is read, never written.
    sh.uniforms.uWall = { value: mat.userData.wall ? 1 : 0 };

    sh.vertexShader = CUT_GLSL + sh.vertexShader.replace(
      '#include <begin_vertex>',
      '#include <begin_vertex>\n  vCutPos = (modelMatrix * vec4(position,1.0)).xyz;');

    sh.fragmentShader = CUT_GLSL + sh.fragmentShader.replace(
      '#include <clipping_planes_fragment>',
      `#include <clipping_planes_fragment>
      {
        bool inCut = false;
        for (int i = 0; i < ${MAXCUT}; i++) {
          if (i >= uNcut) break;
          if (insideOne(uCut[i], vCutPos)) { inCut = true; }
        }
        if (uWall > 0.5) {
          // ⭐ THE WALL OF THE HOLE. Drawn from the cutter's own back faces, and
          //    kept only where it is buried in a solid - otherwise the hole
          //    would hang in the air past the edge of the part.
          bool inSol = false;
          for (int i = 0; i < ${MAXSOL}; i++) {
            if (i >= uNsol) break;
            if (insideOne(uSol[i], vCutPos)) { inSol = true; }
          }
          if (!inSol) discard;
          // ⛔ and the stretch of this wall lying inside ANOTHER hole is not a
          //    wall at all - there is nothing there for it to be the edge of.
          bool inOther = false;
          for (int i = 0; i < ${MAXCUT}; i++) {
            if (i >= uNcut) break;
            if (insideShrunk(uCut[i], vCutPos)) { inOther = true; }
          }
          if (inOther) discard;
        } else if (inCut) {
          discard;                       // ⛔ this pixel is in the hole
        }
      }`);
  };
  mat.needsUpdate = true;
  return mat;
}

function fillSlot(slot, sh) {
  slot.on = 1;
  slot.c.copy(sh.p);
  const q = sh.q || IDQ;
  slot.rot.set(q.x, q.y, q.z, q.w);
  if (sh.kind === 'box') {
    slot.kind = 0;
    slot.h.copy(sh.s).multiplyScalar(0.5);
  } else {
    slot.kind = 1;
    slot.h.set(sh.h / 2, 0, 0);
    slot.ax = sh.axis === 'x' ? 0 : (sh.axis === 'y' ? 1 : 2);
    slot.r0.set(sh.a0, sh.b0);
    slot.r1.set(sh.a1, sh.b1);
  }
}

// ⭐ CALLED WHENEVER ANYTHING MOVES OR CHANGES SIZE, which is why the hole
//    tracks his hand with nothing recomputed - the numbers ARE the hole.
function refreshCuts() {
  let nc = 0, ns = 0;
  SHAPES.forEach(sh => {
    if (sh.neg) { if (nc < MAXCUT) fillSlot(CUT_U.uCut.value[nc++], sh); }
    else        { if (ns < MAXSOL) fillSlot(CUT_U.uSol.value[ns++], sh); }
  });
  for (let i = nc; i < MAXCUT; i++) CUT_U.uCut.value[i].on = 0;
  for (let i = ns; i < MAXSOL; i++) CUT_U.uSol.value[i].on = 0;
  CUT_U.uNcut.value = nc;
  CUT_U.uNsol.value = ns;
}

// ⭐ A CUTTER LOOKS LIKE A TOOL, NOT LIKE A PART. Wireframe, so he can see
//    where it is and grab it, and can never mistake it for material.
// ⭐ the resting orientation, and the one every shape starts at
const IDQ = new THREE.Quaternion();
const BASEQ = new THREE.Quaternion(), AXX = new THREE.Vector3(1,0,0), AXZ = new THREE.Vector3(0,0,1);

// ⭐ a cylinder's geometry is built along Y, so 'x' and 'z' cylinders carry a
//    quarter turn of their own. His free rotation rides ON TOP of that.
function poseOf(sh, o) {
  BASEQ.identity();
  if (sh.kind === 'cyl') {
    if (sh.axis === 'x') BASEQ.setFromAxisAngle(AXZ, Math.PI / 2);
    else if (sh.axis === 'z') BASEQ.setFromAxisAngle(AXX, Math.PI / 2);
  }
  o.quaternion.copy(sh.q || IDQ).multiply(BASEQ);
}

const CUTMAT = new THREE.MeshBasicMaterial({ color:0xff9a5c, wireframe:true,
                                             transparent:true, opacity:0.75 });

// the inside surface of every hole, drawn from the cutters' own back faces
// ⚠️ the flag has to be set BEFORE paintShader reads it, so build the
//    material, mark it, and only then paint it.
const WALLMAT = new THREE.MeshStandardMaterial({
  color:0x9aa4ad, roughness:0.65, metalness:0.05, side:THREE.BackSide });
WALLMAT.userData.wall = true;
paintShader(WALLMAT);

function cutDrop(sh) {
  sh.neg = !sh.neg;
  rebuild(sh);
  refreshCuts();
  return sh.neg ? 'now a hole' : 'now solid again';
}

// ══ HIDING THE CUTTERS ═══════════════════════════════════
// ⭐⭐ JOE, within a minute of his first hole: *"It looks like I cut a hole,
//    but how do I get rid of the wireframe?"*
// ⭐ THE WIREFRAME IS RIGHT WHILE HE IS PLACING A CUTTER AND WRONG THE MOMENT
//    HE WANTS TO LOOK AT THE PART. So it is a toggle, not a decision - one key,
//    nothing armed, nothing remembered.
// ⛔ THE HOLE ITSELF STAYS. Only the orange tool goes. The grey inner wall is
//    the hole, not the cutter, and hiding that would hide the work.
// ⛔ AND A HIDDEN CUTTER IS NOT GRABBABLE - see pickable(). Leaving it
//    clickable would mean he grabs something he cannot see.
let cutsHidden = false;

function applyCutVisibility() {
  SHAPES.forEach(sh => { if (sh.neg && sh.mesh) sh.mesh.visible = !cutsHidden; });
  // ⭐ the button carries the state, so an empty scene still answers the key
  const b = document.querySelector('#box button[data-tool="cut"]');
  if (b) b.classList.toggle('held', cutsHidden);
  if (cutsHidden) { showHandles(null); showHook(null); }
}

function toggleCuts() {
  cutsHidden = !cutsHidden;
  applyCutVisibility();
}

// ⭐ ONE FUNCTION TURNS NUMBERS INTO A MESH, and it is the only place that
//    knows how. Every edit anywhere just changes a number and calls this.
function rebuild(sh) {
  if (sh.mesh) { sh.mesh.geometry.dispose(); scene.remove(sh.mesh); }
  let g;
  if (sh.kind === 'box') {
    g = new THREE.BoxGeometry(sh.s.x, sh.s.y, sh.s.z);
  } else {
    g = frustum(sh);
  }
  // ⭐ a cutter wears the wireframe; a solid wears the painted material. The
  //    cutter ALSO gets a second mesh - its own back faces - which is what
  //    draws the inside of the hole.
  sh.mesh = new THREE.Mesh(g, sh.neg ? CUTMAT : paintShader(MAT.clone()));
  sh.mesh.visible = !(sh.neg && cutsHidden);   // ⛔ a rebuild must not un-hide it
  if (sh.wall) { scene.remove(sh.wall); sh.wall = null; }
  if (sh.neg) {
    sh.wall = new THREE.Mesh(g, WALLMAT);
    sh.wall.userData.shape = sh;      // ⭐ grabbing the wall grabs the hole
    sh.wall.position.copy(sh.p);
    poseOf(sh, sh.wall);
    scene.add(sh.wall);
  }
  sh.mesh.position.copy(sh.p);
  poseOf(sh, sh.mesh);
  sh.mesh.userData.shape = sh;
  scene.add(sh.mesh);
  if (typeof refreshCuts === 'function') refreshCuts();
}
SHAPES.forEach(rebuild);

function bounds() {
  const b = new THREE.Box3();
  SHAPES.forEach(s => b.expandByObject(s.mesh));
  return b;
}

// ══ THE HANDLES ══════════════════════════════════════════════════════════
// ⭐⭐ FOUR PER RIM, AND FOUR FOR A REASON - not symmetry, MEANING. Two of them
//    own one radius, two own the other. Three would be ambiguous; eight would
//    be four with spares.
// ⛔ AND NO KEY IS HELD. He asked for control-drag to lock the opposite pair;
//    the better answer is that GRABBING ONE HANDLE *IS* THE CONSTRAINT. He has
//    nerve damage and cannot rely on holding a modifier - it is the one rule
//    this tool has kept all day: nothing to hold down.
//       grab a HANDLE  -> that one direction only, and its opposite follows
//       grab the WALL  -> the whole end, both directions at once
const HKEYS = [
  { end:0, k:'a0', dir:0 }, { end:0, k:'b0', dir:1 },
  { end:1, k:'a1', dir:0 }, { end:1, k:'b1', dir:1 },
];
const handles = [];
const HMAT = new THREE.MeshBasicMaterial({ color:0xffb37a, depthTest:false });
for (let i = 0; i < 8; i++) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(1, 14, 10), HMAT);
  m.renderOrder = 997; m.visible = false;
  m.userData.slot = i;
  handles.push(m); scene.add(m);
}

// ⭐ A handle sits at the far point of the radius it owns, on the rim, on
//    BOTH sides - so "its opposite follows" is not a rule, it is what you see.
function handlePlaces(sh) {
  const av = axisVec(sh.axis);
  const u = new THREE.Vector3(av.y, av.z, av.x);   // one cross direction
  const v = new THREE.Vector3().crossVectors(av, u).normalize();
  const out = [];
  [0, 1].forEach(end => {
    const c = sh.p.clone().add(av.clone().multiplyScalar((end ? 1 : -1) * sh.h/2));
    const ra = end ? sh.a1 : sh.a0, rb = end ? sh.b1 : sh.b0;
    out.push({ end, dir:0, k:(end?'a1':'a0'), pts:[c.clone().add(u.clone().multiplyScalar(ra)),
                                                   c.clone().sub(u.clone().multiplyScalar(ra))], axis:u });
    out.push({ end, dir:1, k:(end?'b1':'b0'), pts:[c.clone().add(v.clone().multiplyScalar(rb)),
                                                   c.clone().sub(v.clone().multiplyScalar(rb))], axis:v });
  });
  return out;
}

// ⭐⭐ THE WAIST RING. Joe, 2026-08-20: *"can you put a ring in the center,
//    midway between the ends, to pull the whole cylinder's diameter? Right now
//    the only way to change the size is to do each end separately."*
// ⭐ AND IT SCALES, IT DOES NOT ADD. If he has already drawn the thing up into
//    a cone, fattening it must keep the taper - adding the same amount to both
//    ends would quietly straighten it out, and he would have lost the shape he
//    made without ever being told.
const waist = new THREE.Mesh(new THREE.TorusGeometry(1, 0.045, 8, 64),
  new THREE.MeshBasicMaterial({ color:0xffb37a, transparent:true, opacity:0.9,
                                depthTest:false }));
waist.renderOrder = 996; waist.visible = false; scene.add(waist);

function meanR(sh) { return (sh.a0 + sh.b0 + sh.a1 + sh.b1) / 4; }

// ⭐⭐ THE HOOK. Joe, 2026-08-20: *"I need a method for actually dragging
//    shapes around and moving them... stack them on top of each other and
//    stick them to the side."*
// ⛔ IT CANNOT BE "DRAG THE BODY" - dragging the body already means push the
//    face, and that is the rule the whole tool rests on. So moving gets its
//    own grab point, in the same vocabulary as the beads and the waist.
// ⭐ IT SITS ABOVE THE SHAPE LIKE A LIFTING EYE, not at the centre. A ball
//    floating inside a box reads as a bug; a hook over the top reads as
//    "pick this up" without anybody explaining it.
// ⚠️ AND IT MOVES ON THE PLANE FACING THE CAMERA. Turning 2D mouse motion into
//    3D placement is genuinely ambiguous - he said so himself. This gets him
//    CLOSE, and SNAP is what makes it land. Rough placement plus a snap is
//    legible; rough placement alone is a pile.
const hook = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12),
  new THREE.MeshBasicMaterial({ color:0x9ad1ff, depthTest:false }));
hook.renderOrder = 995; hook.visible = false; scene.add(hook);
let hookOwner = null;

// ⛔⛔ IT USED TO SIT ABOVE THE SHAPE AND THAT WAS MY ERROR, reasoned rather
//    than measured. I put it up there because a ball floating inside a solid
//    "reads as a bug" and a hook over the top "reads as pick this up."
// ⭐⭐ HIS HANDS SAID OTHERWISE, 2026-08-20: *"if we can move that blue dot down
//    into the body of the part, somewhere away from the handles... When I have
//    a tall handle, I have to do it by the way from up top, and it's hard to
//    see what I'm doing."*
// ⭐ THE CENTRE IS THE ONE PLACE THAT IS ALWAYS AWAY FROM THE HANDLES. Every
//    grab this tool has lives on a SURFACE - faces, rims, the waist ring. The
//    middle of the solid is the only spot nothing else wants, and on a tall
//    part it is half the reach of the top.
// ⚠️ THE COST, STATED: it now sits where he might also push a face from
//    head-on. It is small and he can see it, so he can aim past it - but if it
//    starts stealing grabs, offset it a third of the way down instead.
function shapeCentre(sh) { return sh.p.clone(); }

function showHook(sh) {
  // ⭐⭐ HE SEES WHAT HE IS ABOUT TO PICK UP, BEFORE HE PICKS IT UP. A hook that
  //    silently carries three other shapes is a surprise, and a surprise in a
  //    tool he cannot undo with fine motor control is the thing to avoid.
  // ⛔⛔ JOE: *"I cannot move them."* AND IT WAS WORSE THAN HE SAID - one
  //    cutter anywhere in the scene stopped him moving ANYTHING.
  // ⚠️ A cutter wears MeshBasicMaterial, which has NO `.emissive`. This line
  //    ran over every shape, hit the cutter, and threw - before the line that
  //    makes the hook visible. So the blue dot never appeared again, for any
  //    shape, from the first cut onward. A crash three statements early looks
  //    exactly like a feature that was never built.
  // ⭐ A cutter simply has no glow channel; that is not an error, so skip it
  //    and carry on rather than dying on it.
  SHAPES.forEach(o => { if (o.mesh && o.mesh.material.emissive) o.mesh.material.emissive.setHex(0x000000); });
  hookOwner = sh || null;
  if (!sh) { hook.visible = false; return; }
  crewOf(sh).forEach(o => {
    if (o !== sh && o.mesh && o.mesh.material.emissive) o.mesh.material.emissive.setHex(0x3a2610);
  });
  hook.position.copy(shapeCentre(sh));
  hook.scale.setScalar(Math.max(1.8, radius() * 0.026));
  hook.visible = true;
}

let handleOwner = null;
function showHandles(sh) {
  handles.forEach(m => m.visible = false);
  handleOwner = null;
  waist.visible = false;
  waist.visible = false;
  if (!sh || sh.kind !== 'cyl') return;
  handleOwner = sh;

  // sits at the midpoint, across the axis, sized to the average of the ends
  const r = meanR(sh);
  waist.position.copy(sh.p);
  waist.scale.set(r, r, Math.max(r * 0.06, 0.6));
  waist.rotation.set(0, 0, 0);
  if (sh.axis === 'y') waist.rotation.x = Math.PI / 2;
  if (sh.axis === 'x') waist.rotation.y = Math.PI / 2;
  waist.visible = true;
  const places = handlePlaces(sh);
  const size = Math.max(1.6, radius() * 0.022);
  let n = 0;
  places.forEach(pl => pl.pts.forEach(pt => {
    const m = handles[n++];
    m.position.copy(pt);
    m.scale.setScalar(size);
    m.userData.place = pl;
    m.visible = true;
  }));
}

// ══ THE VIEW ═════════════════════════════════════════════════════════════
const orbit = { yaw:0.72, pitch:0.42, dist:260 };

// ⭐ WHAT YOU ORBIT AROUND IS A CHOICE. Zoom moves you toward the CENTRE;
//    looking at a detail means moving the centre TO the detail. Double-tap the
//    spot. Joe, on getting it: "That is a big fix for something that has
//    annoyed me on SolidWorks for a decade or more."
const pivot = new THREE.Vector3();
const pivotWant = new THREE.Vector3();

const spot = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12),
  new THREE.MeshBasicMaterial({ color:0xffb37a, transparent:true, opacity:0.85,
                                depthTest:false }));
spot.renderOrder = 998; spot.visible = false; scene.add(spot);

// ⭐ KEEP THE SIZE HE PICKED, NOT A SIZE I PICKED. Joe: "can it do auto-fit on
//    the zoom? I like that size right there." Auto-fit would choose for him.
//    This remembers the RATIO of camera distance to how big the thing is and
//    holds that as shapes grow under his hands. And it EASES, never snaps - a
//    camera that jumps while his hand is moving is the tool fighting him.
let framing = null;
const EASE = 0.12;
function radius() {
  const b = bounds();
  return Math.max(b.getSize(new THREE.Vector3()).length() * 0.5, 1);
}
function framingRadius() { return spot.visible ? Math.max(radius() * 0.18, 4) : radius(); }
function holdFraming() {
  const r = framingRadius();
  if (framing === null) { framing = orbit.dist / r; return; }
  orbit.dist += (framing * r - orbit.dist) * EASE;
}

function placeCamera() {
  pivot.lerp(pivotWant, 0.14);
  const cp = Math.cos(orbit.pitch);
  camera.position.set(pivot.x + Math.sin(orbit.yaw) * cp * orbit.dist,
                      pivot.y + Math.sin(orbit.pitch)     * orbit.dist,
                      pivot.z + Math.cos(orbit.yaw) * cp * orbit.dist);
  camera.lookAt(pivot);
}
(function initPivot(){ bounds().getCenter(pivotWant); pivot.copy(pivotWant); })();

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ══ WHAT YOUR HAND IS ON ═════════════════════════════════════════════════
const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
function toNdc(e) {
  ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
}

// ⭐ A HANDLE IS A NUMBER YOU CAN GRAB. Box faces move a wall. A cylinder's
//    flat ends move its length; its BARREL moves the radius of whichever end
//    you are nearest - which is exactly "squeeze one end and draw it up".
function handleUnder(e) {
  toNdc(e);
  ray.setFromCamera(ptr, camera);

  // ⭐ A HANDLE OUTRANKS THE SURFACE BEHIND IT. It is smaller and it is
  //    deliberate - if he aimed at the bead he meant the bead, and losing that
  //    to the wall behind it is the tool second-guessing him.
  if (hook.visible) {
    const kh = ray.intersectObject(hook, false)[0];
    if (kh) return { sh:hookOwner, type:'move', point:kh.point };
  }

  if (waist.visible) {
    const wh = ray.intersectObject(waist, false)[0];
    if (wh) return { sh:handleOwner, type:'whole', point:wh.point };
  }

  const hh = ray.intersectObjects(handles.filter(m => m.visible), false)[0];
  if (hh) {
    const pl = hh.object.userData.place;
    // ⛔⛔ HALF THE BEADS RAN BACKWARDS AND HIS HANDS FOUND IT, 2026-08-20:
    //    *"the handle drag on the ellipse is backwards... in fairness, if I
    //    drag from the bottom, it doesn't matter."*
    // ⭐⭐ THAT SECOND SENTENCE IS THE WHOLE DIAGNOSIS. A pair of beads sits on
    //    OPPOSITE sides of the centreline and both were handed the SAME travel
    //    direction - so one pulled outward and its twin pulled inward, and the
    //    only reason it was not obvious is that half of them were right.
    // ⭐ A BEAD MUST TRAVEL THE WAY IT ITSELF POINTS: outward from the
    //    centreline, through the bead. Read that off the bead's own position
    //    rather than off the radius it belongs to.
    const av = axisVec(handleOwner.axis);
    const r = hh.object.position.clone().sub(handleOwner.p);
    r.sub(av.clone().multiplyScalar(r.dot(av)));        // its radial part
    const dir = pl.axis.clone();
    if (r.dot(dir) < 0) dir.negate();
    return { sh:handleOwner, type:'rad1', k:pl.k, end:pl.end,
             dirAxis:dir, point:hh.point };
  }

  const hit = ray.intersectObjects(pickable(), false)[0];
  if (!hit) return null;
  const sh = hit.object.userData.shape;
  const n = hit.face.normal.clone();

  if (sh.kind === 'box') {
    const axis = Math.abs(n.x) > 0.5 ? 'x' : Math.abs(n.y) > 0.5 ? 'y' : 'z';
    return { sh, type:'face', axis, sign:n[axis] > 0 ? 1 : -1, point:hit.point };
  }

  // cylinder: the local normal points along Y on the caps, sideways on the wall
  const cap = Math.abs(n.y) > 0.7;
  const local = sh.mesh.worldToLocal(hit.point.clone());
  const end = local.y > 0 ? 1 : 0;           // 1 = the r1 end, 0 = the r0 end
  return cap
    ? { sh, type:'length', end, sign:(n.y > 0 ? 1 : -1), point:hit.point }
    : { sh, type:'radius', end, point:hit.point };   // wall = the whole end
}

function showGhost(h) {
  // ⛔ same reason: the ghost marks the face being pushed, and a carry pushes
  //    no face. It was drawing one from an undefined axis.
  if (!h || h.type === 'move') { ghost.visible = false; return; }
  if (h.sh.kind === 'box') {
    const s = h.sh.s, c = h.sh.p, lift = 0.3;
    ghost.rotation.set(0,0,0);
    ghost.geometry.dispose();
    if (h.axis === 'x') {
      ghost.geometry = new THREE.PlaneGeometry(s.z, s.y);
      ghost.rotation.y = Math.PI/2;
      ghost.position.set(c.x + h.sign*(s.x/2 + lift), c.y, c.z);
    } else if (h.axis === 'y') {
      ghost.geometry = new THREE.PlaneGeometry(s.x, s.z);
      ghost.rotation.x = Math.PI/2;
      ghost.position.set(c.x, c.y + h.sign*(s.y/2 + lift), c.z);
    } else {
      ghost.geometry = new THREE.PlaneGeometry(s.x, s.y);
      ghost.position.set(c.x, c.y, c.z + h.sign*(s.z/2 + lift));
    }
    ghost.visible = true;
    return;
  }
  // on a cylinder the honest highlight is the rim you have hold of. ⚠️ It is
  // drawn round at the mean radius even when the end is an ellipse - a small
  // lie, and the alternative is a custom ring geometry rebuilt every frame for
  // a hint that is already doing its job.
  const sh = h.sh;
  const r = h.end ? (sh.a1 + sh.b1) / 2 : (sh.a0 + sh.b0) / 2;
  ghost.geometry.dispose();
  ghost.geometry = new THREE.RingGeometry(Math.max(r - 1.6, 0.2), r + 1.6, SEG);
  const off = axisVec(sh.axis).multiplyScalar((h.end ? 1 : -1) * (sh.h/2 + 0.35));
  ghost.position.copy(sh.p).add(off);
  ghost.rotation.set(0,0,0);
  if (sh.axis === 'y') ghost.rotation.x = Math.PI/2;
  if (sh.axis === 'x') ghost.rotation.y = Math.PI/2;
  ghost.visible = true;
}

// ══ THE RULER ════════════════════════════════════════════════════════════
// ⛔ NOT A DIMENSION BOX AND MUST NEVER BECOME ONE. His rule: "if it ever needs
//    a dimension box, it has drifted." A box is where you TYPE. This is
//    read-only, exists only while he is pulling, and takes no input.
// ⭐ ONE DECIMAL INCH, ON PURPOSE - "it doesn't have to be accurate except in
//    maybe one decimal place." Tenths read as "about so big" rather than as a
//    specification, which is the truth about this tool.
const dimLines = new THREE.LineSegments(new THREE.BufferGeometry(),
  new THREE.LineBasicMaterial({ color:0xffb37a, transparent:true, opacity:0.75,
                                depthTest:false }));
dimLines.renderOrder = 999; dimLines.visible = false; scene.add(dimLines);
const dimEl = document.getElementById('dim');

function setDimLine(a, z, tick) {
  const pts = [a, z, a.clone().sub(tick), a.clone().add(tick),
                     z.clone().sub(tick), z.clone().add(tick)];
  const arr = new Float32Array(pts.length * 3);
  pts.forEach((v,i) => { arr[i*3]=v.x; arr[i*3+1]=v.y; arr[i*3+2]=v.z; });
  dimLines.geometry.dispose();
  dimLines.geometry = new THREE.BufferGeometry();
  dimLines.geometry.setAttribute('position', new THREE.BufferAttribute(arr,3));
  dimLines.visible = true;
}
function label(mm, mid) {
  dimEl.textContent = (mm / 25.4).toFixed(1) + '"';
  const p = mid.clone().project(camera);
  dimEl.style.left = ((p.x*0.5+0.5) * innerWidth) + 'px';
  dimEl.style.top  = ((-p.y*0.5+0.5) * innerHeight) + 'px';
  dimEl.classList.add('on');
}
const OTHER = { x:['y','z'], y:['x','z'], z:['x','y'] };

function showDim(h) {
  // ⛔⛔ FOUND BY DRIVING IT IN A BROWSER, 2026-08-20, and it had been throwing
  //    on EVERY carry since move was built. A move handle has no `axis`, so
  //    `OTHER[undefined]` destructured to nothing and this threw - after the
  //    drag had already begun, so the exception went to the event loop and the
  //    move still worked. ⭐ A BUG WHOSE ONLY SYMPTOM IS A LINE IN A CONSOLE
  //    NOBODY OPENS IS THE SAME FAMILY AS THE DEAD WAKE BLOCK: the failure
  //    looks exactly like success.
  // ⭐ AND THE RIGHT FIX IS NOT A GUARD, IT IS AN ANSWER: carrying a shape
  //    changes no number, so there is nothing for the ruler to say. It stays
  //    away, which is also what he asked of it - the ruler exists only while
  //    he is pulling.
  if (!h || h.type === 'move') { hideDim(); return; }
  const sh = h.sh;
  if (sh.kind === 'box') {
    // ⭐ PICK THE EDGE HE IS NOT STANDING ON, every frame - of the four running
    //    along the drag axis, whichever lands furthest from the cursor.
    const ax = h.axis, [a,b] = OTHER[ax];
    let best = null, bestD = -1;
    for (const sa of [0,1]) for (const sb of [0,1]) {
      const m = sh.p.clone();
      m[a] += (sa?1:-1) * sh.s[a]/2;
      m[b] += (sb?1:-1) * sh.s[b]/2;
      const sp = m.project(camera);
      const d = (sp.x-ptr.x)**2 + (sp.y-ptr.y)**2;
      if (d > bestD) { bestD = d; best = {a,b,sa,sb}; }
    }
    const out = Math.max(6, Math.min(sh.s.x, sh.s.y, sh.s.z) * 0.22);
    const mk = (t) => {
      const v = sh.p.clone();
      v[ax] += (t?1:-1) * sh.s[ax]/2;
      v[best.a] += (best.sa?1:-1) * (sh.s[best.a]/2 + out);
      v[best.b] += (best.sb?1:-1) * (sh.s[best.b]/2 + out);
      return v;
    };
    const A = mk(0), Z = mk(1);
    const tick = new THREE.Vector3();
    tick[best.a] = (best.sa?1:-1) * out * 0.3;
    tick[best.b] = (best.sb?1:-1) * out * 0.3;
    setDimLine(A, Z, tick);
    label(sh.s[ax], A.clone().add(Z).multiplyScalar(0.5));
    return;
  }

  const av = axisVec(sh.axis);
  const side = (h.type === 'rad1') ? h.dirAxis.clone()
                                   : new THREE.Vector3(av.y, av.z, av.x);
  if (h.type === 'whole') {
    // across the waist itself - the number he is actually setting
    const r = meanR(sh);
    const across = side.clone().multiplyScalar(r);
    setDimLine(sh.p.clone().sub(across), sh.p.clone().add(across),
               av.clone().multiplyScalar(Math.max(2, r * 0.14)));
    label(r * 2, sh.p.clone());
    return;
  }
  if (h.type === 'length') {
    const off = Math.max(6, Math.max(sh.a0, sh.b0, sh.a1, sh.b1) * 1.35);
    const s2 = side.clone().multiplyScalar(off);
    const A = sh.p.clone().sub(av.clone().multiplyScalar(sh.h/2)).add(s2);
    const Z = sh.p.clone().add(av.clone().multiplyScalar(sh.h/2)).add(s2);
    setDimLine(A, Z, s2.clone().normalize().multiplyScalar(off*0.22));
    label(sh.h, A.clone().add(Z).multiplyScalar(0.5));
  } else {
    // diameter across the end he has hold of - the number a machinist wants,
    // and on an ellipse it is the one in the direction he is actually pulling
    const r = (h.type === 'rad1') ? sh[h.k]
                                  : (h.end ? (sh.a1 + sh.b1)/2 : (sh.a0 + sh.b0)/2);
    const c = sh.p.clone().add(av.clone().multiplyScalar((h.end?1:-1) * sh.h/2));
    const across = side.clone().multiplyScalar(r);
    setDimLine(c.clone().sub(across), c.clone().add(across),
               av.clone().multiplyScalar(Math.max(2, r*0.14)));
    label(r * 2, c);
  }
}
function hideDim() { dimLines.visible = false; dimEl.classList.remove('on'); }

// ══ DRAGGING ═════════════════════════════════════════════════════════════
// ⭐ THE HANDLE FOLLOWS THE CURSOR, not a scaled mouse delta. Build a plane
//    containing the travel axis that faces the camera as squarely as it can,
//    and read where the cursor lands on it. That is why it feels like pushing
//    the thing rather than driving a slider.
let drag = null, turning = null;
const dragPlane = new THREE.Plane();
const scratch = new THREE.Vector3();

function travelAxis(h) {
  if (h.type === 'whole') {
    // straight out from the centreline, through wherever he took hold
    const av = axisVec(h.sh.axis);
    const v = h.point.clone().sub(h.sh.p);
    v.sub(av.clone().multiplyScalar(v.dot(av)));
    return v.lengthSq() < 1e-6 ? new THREE.Vector3(1,0,0) : v.normalize();
  }
  if (h.type === 'rad1') return h.dirAxis.clone();
  if (h.sh.kind === 'box') return axisVec(h.axis);
  if (h.type === 'length') return axisVec(h.sh.axis);
  // radius: travel is straight out from the centreline, through the hit point
  const av = axisVec(h.sh.axis);
  const v = h.point.clone().sub(h.sh.p);
  v.sub(av.clone().multiplyScalar(v.dot(av)));
  return v.lengthSq() < 1e-6 ? new THREE.Vector3(1,0,0) : v.normalize();
}

function beginDrag(h) {
  if (h.type === 'move') {
    const n = camera.position.clone().sub(h.sh.p).normalize();
    dragPlane.setFromNormalAndCoplanarPoint(n, h.sh.p);
    const at = new THREE.Vector3();
    ray.ray.intersectPlane(dragPlane, at);
    drag = { ...h, type:'move',
             grab: at.clone().sub(h.sh.p),      // keep the hook under his cursor
             // ⭐ THE CREW IS TAKEN ONCE, AT THE START. Walking the welds every
             //    frame would let a snap made mid-drag change what he is
             //    carrying underneath his own hand.
             crew: crewOf(h.sh),
             was: { p:h.sh.p.clone() } };
    return;
  }
  const a = travelAxis(h);
  const toCam = camera.position.clone().sub(h.point).normalize();
  const n = toCam.clone().sub(a.clone().multiplyScalar(toCam.dot(a)));
  // ⛔⛔ THE PYRAMID BUG, 2026-08-20. When the direction he is pulling points
  //    nearly straight at the camera, this plane goes edge-on and the maths
  //    goes singular: a pixel of mouse becomes a mile of radius. He grabbed the
  //    near side of a cylinder and its base went to Giza. SolidWorks does the
  //    same thing for the same reason, which is why he recognised it.
  // ⭐ THE OLD GUARD WAS 1e-6 - far too tight. It only caught EXACTLY head-on,
  //    and the damage happens long before exactly.
  const cond = Math.abs(toCam.dot(a));         // 1 = head-on, 0 = square on
  if (n.lengthSq() < 1e-4) n.set(0,1,0);
  dragPlane.setFromNormalAndCoplanarPoint(n.normalize(), h.point);
  drag = { ...h, a, cond,
           // ⭐ what "too big" means for THIS shape, so the guard scales with
           //    the part instead of being a number I picked out of the air
           cap: (h.sh.kind === 'box'
                 ? Math.max(h.sh.s.x, h.sh.s.y, h.sh.s.z)
                 : Math.max(h.sh.h, h.sh.a0, h.sh.b0, h.sh.a1, h.sh.b1)) * 4 + 60,
           start: h.point.clone(),
           was: h.sh.kind === 'box' ? { s:h.sh.s.clone(), p:h.sh.p.clone() }
                                    : { h:h.sh.h, a0:h.sh.a0, b0:h.sh.b0,
                                        a1:h.sh.a1, b1:h.sh.b1,
                                        p:h.sh.p.clone() } };
}

function moveDrag(e) {
  toNdc(e);
  ray.setFromCamera(ptr, camera);
  if (!ray.ray.intersectPlane(dragPlane, scratch)) return;

  if (drag.type === 'move') {
    const before = drag.sh.p.clone();
    drag.sh.p.copy(scratch).sub(drag.grab);

    // ⭐ Propose from where his hand actually is, then move the shape to the
    //    proposal. Shove past the tolerance and there is no proposal any more -
    //    which is how he overrules it without holding anything down.
    // ⛔ AND THE CREW IS INVISIBLE TO THE SNAP. Without that, a welded pair
    //    proposes snapping to itself, forever, and the whole assembly locks up
    //    the moment you pick it up.
    const prop = proposeSnap(drag.sh, drag.crew);
    if (prop) drag.sh.p.add(prop.move);
    showSnap(drag.sh, prop);

    // ⭐⭐ THE ANSWER TO HIS COMPLAINT, AND IT IS ONE LINE: everything welded
    //    to it moves by the SAME delta. Move the base and the post comes with
    //    it - which is the entire point of the rung.
    const delta = drag.sh.p.clone().sub(before);
    drag.crew.forEach(o => {
      if (o === drag.sh) return;
      o.p.add(delta);
      o.mesh.position.copy(o.p);
    });

    drag.sh.mesh.position.copy(drag.sh.p);     // ⭐ no rebuild - nothing changed
    syncCuts();                                 //    shape, only where it is
    refreshWelds();
    showHook(drag.sh);
    showHandles(drag.sh.kind === 'cyl' ? drag.sh : null);
    return;
  }
  let d = scratch.clone().sub(drag.start).dot(drag.a);

  // ⚠️ TWO GUARDS, AND BOTH ARE HONEST ABOUT WHAT THEY GIVE UP.
  // 1 · Ill-conditioned pull: soften it rather than refusing it. Refusing feels
  //     broken; softening feels like the shape is stiff from that angle, which
  //     is at least a thing a hand understands.
  if (drag.cond > 0.86) d *= Math.max(0.06, (1 - drag.cond) / 0.14);
  // 2 · Nothing may leap further than a few times its own size in one move.
  //     ⭐ He can still get there - keep dragging - but he cannot arrive by
  //     accident, and he can always see it happening.
  d = Math.max(-drag.cap, Math.min(drag.cap, d));

  const sh = drag.sh, w = drag.was;
  if (sh.kind === 'box') {
    const ax = drag.axis;
    const grow = drag.sign * d;                       // outward is positive
    sh.s[ax] = Math.max(FLOOR, w.s[ax] + grow);
    // ⭐ the opposite wall stays put - you are moving ONE face, not scaling
    sh.p[ax] = w.p[ax] + drag.sign * (sh.s[ax] - w.s[ax]) / 2;
  } else if (drag.type === 'length') {
    const grow = drag.sign * d;
    sh.h = Math.max(FLOOR, w.h + grow);
    sh.p.copy(w.p).add(axisVec(sh.axis).multiplyScalar(drag.sign * (sh.h - w.h) / 2));
  } else if (drag.type === 'whole') {
    // ⭐ one factor, all four numbers - the proportions he made are preserved
    const was = (w.a0 + w.b0 + w.a1 + w.b1) / 4;
    const k = Math.max(0.02, (was + d) / Math.max(was, 0.001));
    sh.a0 = Math.max(0.2, w.a0 * k); sh.b0 = Math.max(0.2, w.b0 * k);
    sh.a1 = Math.max(0.2, w.a1 * k); sh.b1 = Math.max(0.2, w.b1 * k);
  } else if (drag.type === 'rad1') {
    // ⭐⭐ ONE DIRECTION ONLY. This is the ellipse, and nothing was held down to
    //    get it - he grabbed the bead that owns this radius.
    sh[drag.k] = Math.max(0.2, w[drag.k] + d);
  } else {
    // ⭐ THE WALL MOVES THE WHOLE END, both directions together, so a round
    //    thing stays round unless he asks otherwise. Squeeze one end and the
    //    cylinder draws up into a cone - his own finding.
    const ka = drag.end ? 'a1' : 'a0', kb = drag.end ? 'b1' : 'b0';
    sh[ka] = Math.max(0.2, w[ka] + d);
    sh[kb] = Math.max(0.2, w[kb] + d);
  }
  rebuild(sh);
  syncCuts();
  // ⭐ RIGHT HERE, WHERE THE NUMBERS HAVE JUST CHANGED AND THE MESH IS FRESH.
  //    It used to run in a microtask, which was a way of saying "later" without
  //    knowing when later was. Face pushes, deform, the beads and the waist all
  //    land on this line, so one call covers every way a shape can change.
  holdWelds(sh);
  showGhost(drag);
  showDim(drag);
  showHandles(sh.kind === 'cyl' ? sh : null);
}

// ══ THE TOOLBOX ══════════════════════════════════════════════════════════
// ⛔ DRAG IT OUT AND LET GO - no click-then-click. A click-to-arm-then-click-to-
//    place is a MODE, and the whole tool has none. Pick it up, drop it, done.
// ⭐ WHERE IT LANDS: on the face under the cursor if there is one, sitting on
//    top of it rather than through it. Otherwise on the ground plane. He said
//    "drop the shape onto the face where I want it, or just position it."
let carrying = null;

// ⭐ ONE LIST OF WHAT THE MOUSE CAN HIT, so hiding a cutter hides it from
//    the cursor as well. ⛔ A thing he cannot see that still takes his click is
//    exactly the surprise this file keeps warning about.
// ⭐⭐ JOE, after the first pocket: *"the wireframe hide works, but I can't
//    edit the cut features."* Both halves of that are one bug. Hiding the
//    orange tool took the hole out of his reach, because the only thing he
//    could ever grab was the tool - never the hole itself.
// ⭐⭐ THE ANSWER IS THE ONE THE DESIGN RECORD ALREADY PROMISED: *grab ITS
//    wall, the hole gets wider.* The wall of a hole is a real surface, drawn
//    every frame, sitting exactly where he is already pointing. So make it
//    grabbable and route the grab to the shape that owns it. Now the hole
//    edits the same way a solid does, hidden tool or not - and hiding the
//    wireframe costs him nothing at all.
function pickable() {
  const out = [];
  SHAPES.forEach(s => {
    if (s.mesh && s.mesh.visible) out.push(s.mesh);
    if (s.wall && s.wall.visible) out.push(s.wall);
  });
  return out;
}

function shapeAt(e) {
  toNdc(e);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(pickable(), false)[0];
  return hit ? hit.object.userData.shape : null;
}

function groundOrFace(e) {
  toNdc(e);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(pickable(), false)[0];
  if (hit) return { at:hit.point.clone(), n:hit.face.normal.clone()
                      .transformDirection(hit.object.matrixWorld) };
  // the grid, so a dropped thing has somewhere to be
  const plane = new THREE.Plane(new THREE.Vector3(0,1,0), 150);
  const at = new THREE.Vector3();
  return ray.ray.intersectPlane(plane, at)
    ? { at, n:new THREE.Vector3(0,1,0) }
    : { at:pivot.clone(), n:new THREE.Vector3(0,1,0) };
}

document.querySelectorAll('#box button').forEach(btn => {
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    // ⭐⭐ MATE IS PICKED UP BY A CLICK, NOT A DRAG. His call, 2026-08-20: *"I'd
    //    rather have it where I just click the mate, go over it, click one,
    //    click two, and that's it, not have to drag the mate."*
    // ⛔ AND IT DOES NOT BREAK THE NO-DRAG-TO-ARM RULE - it CLARIFIES it. A
    //    shape is dropped in a PLACE, so the drag ends where it belongs. Mate
    //    acts on two things somewhere else entirely; there is nowhere to drop
    //    it. ⭐ Drag out what has a destination; click what has a target.
    if (btn.dataset.tool === 'mate' || btn.dataset.tool === 'turn') {
      const want = btn.dataset.tool;
      const already = (want === 'mate' ? mateHeld : turnHeld);
      dropTool();
      if (already) return;                     // click it again to put it down
      if (want === 'mate') { mateHeld = true; mateBtn = btn; }
      else { turnHeld = true; turnBtn = btn; }
      btn.classList.add('held');
      return;
    }
    btn.setPointerCapture(e.pointerId);
    carrying = { kind:btn.dataset.kind, tool:btn.dataset.tool, btn };
    btn.classList.add('armed');
  });
  btn.addEventListener('pointerup', (e) => {
    if (!carrying) return;
    const kind = carrying.kind, tool = carrying.tool;
    carrying.btn.classList.remove('armed');
    try { btn.releasePointerCapture(e.pointerId); } catch (_) {}
    carrying = null;
    // ⛔ let go over the strip itself = he changed his mind. Not an error, and
    //    not a shape dumped behind the toolbox where he cannot reach it.
    if (e.clientX < 84) return;

    // ⭐ A TOOL IS DROPPED ON A THING; A SHAPE IS DROPPED IN A PLACE. Same
    //    gesture out of the same carousel, which is what makes the next tool
    //    (the knife) cost nothing to teach.
    if (tool === 'cut') {
      const on = shapeAt(e);
      if (!on) return;
      snapshot();
      cutDrop(on);
      showHook(null);
      return;
    }

    if (tool === 'weld') {
      const on = shapeAt(e);
      if (!on) return;                      // dropped on air - nothing happened
      snapshot();
      weldDrop(on);
      refreshWelds();
      showHook(null);
      return;
    }

    snapshot();
    const size = Math.max(24, radius() * 0.45);
    const spot = groundOrFace(e);
    const sh = makeShape(kind, spot.at, size);
    // ⭐ sit ON the surface, not half inside it - a shape that lands buried
    //    reads as a bug even when the numbers are right
    const half = sh.kind === 'box'
      ? Math.abs(spot.n.x)*sh.s.x/2 + Math.abs(spot.n.y)*sh.s.y/2 + Math.abs(spot.n.z)*sh.s.z/2
      : sh.h/2;
    sh.p.add(spot.n.multiplyScalar(half));
    SHAPES.push(sh);
    rebuild(sh);
  });
});

// ══ TURN ═════════════════════════════════════════════════════════════════
// ⭐⭐⭐ THE THIRD TIME THIS HAS HAPPENED AND IT IS NOW A LAW OF THIS TOOL.
//    A cone was not a new shape - it was a cylinder with two radii.
//    An ellipse was not a new shape - it was a circle with two radii.
//    ⭐ AND A QUARTER TURN IS NOT A ROTATION - IT IS SWAPPING TWO NUMBERS.
//    Turn a box on its side and its width and its height trade places. Turn a
//    cylinder and its axis letter changes from 'y' to 'x'. NOTHING ROTATES.
//    The design record says look for this before writing a new primitive, and
//    it has paid three times out of three.
//
// ⛔⛔ WHY NOT FREE ROTATION, STATED PLAINLY SO NOBODY RE-LITIGATES IT: every
//    fast thing in this tool depends on shapes being axis-aligned. ext() is a
//    subtraction. A face has one axis and one sign. Snap compares three
//    numbers. A weld is a contact axis plus two fractions. Mate is a
//    translation. ⛔ TILT ONE PART THIRTY DEGREES AND ALL FIVE OF THOSE NEED
//    REWRITING, and push-pull - the thing he actually likes - is the first
//    casualty. A quarter turn buys him the part on its side, which is what he
//    asked for, and costs literally nothing.
// ⚠️ WHAT IT HONESTLY WILL NOT DO: anything at forty-five degrees. When he
//    wants that, it is the same conversation as cut - a real decision about
//    the representation, not a patch.
//
// ⭐ AND IT TURNS IN THE PLANE HE IS LOOKING AT. Not about a fixed world axis -
//    about whichever one points at the camera, so the part rolls the way the
//    screen says it should. Click again and it keeps going round.
let turnHeld = false, turnBtn = null;

function viewAxis() {
  const f = new THREE.Vector3();
  camera.getWorldDirection(f);
  const a = Math.abs(f.x), b = Math.abs(f.y), c = Math.abs(f.z);
  return (a >= b && a >= c) ? 'x' : (b >= c ? 'y' : 'z');
}

// ⭐ the whole crew rolls together, about the part he clicked
function quarterTurn(sh, ax) {
  const rest = AX.filter(x => x !== ax);
  const pAx = rest[0], qAx = rest[1];
  const rot = new THREE.Quaternion().setFromAxisAngle(axisVec(ax), Math.PI / 2);
  const centre = sh.p.clone();

  crewOf(sh).forEach(o => {
    // its own numbers trade places
    if (o.kind === 'box') {
      const t = o.s[pAx]; o.s[pAx] = o.s[qAx]; o.s[qAx] = t;
    } else if (o.axis === pAx) { o.axis = qAx; }
    else if (o.axis === qAx) { o.axis = pAx; }
    else {
      // ⭐ rolling a cylinder about its OWN axis is not nothing - an elliptical
      //    end swaps which way it is wide. On a round one it is invisible, and
      //    that is correct rather than broken.
      let t = o.a0; o.a0 = o.b0; o.b0 = t;
      t = o.a1; o.a1 = o.b1; o.b1 = t;
    }
    // and where it sits swings round the part he clicked
    const rel = o.p.clone().sub(centre).applyQuaternion(rot);
    // ⛔ exactly 90 degrees should stay exact - float dust here becomes a weld
    //    that is one thousandth off, which snap and mate would then argue with
    AX.forEach(x => { rel[x] = Math.round(rel[x] * 1e5) / 1e5; });
    o.p.copy(centre).add(rel);
    rebuild(o);
  });

  // ⭐ THE CONTACT AXIS OF EVERY WELD IN THE CREW HAS JUST CHANGED. Re-derive it
  //    from where things actually are now rather than trying to rotate the old
  //    relationship - the positions are right, so the relationship read off them
  //    is right, and there is no arithmetic to get wrong.
  const crew = crewOf(sh);
  WELDS.forEach(w => {
    const a = SHAPES[w[0]], b = SHAPES[w[1]];
    if (!a || !b || crew.indexOf(a) < 0 || crew.indexOf(b) < 0) return;
    w.r = [relOf(b, a), relOf(a, b)];
  });
  refreshWelds();
}

// ⭐ SHOW IT FIRST - the lesson mate taught, applied before he has to ask twice.
function showTurnPreview(sh) {
  if (!sh) { preview.visible = false; return; }
  const ax = viewAxis();
  const rest = AX.filter(x => x !== ax);
  const e = ext(sh);
  const sz = new THREE.Vector3().subVectors(e.max, e.min);
  const t = sz[rest[0]]; sz[rest[0]] = sz[rest[1]]; sz[rest[1]] = t;
  preview.scale.set(Math.max(sz.x, .01), Math.max(sz.y, .01), Math.max(sz.z, .01));
  preview.position.copy(sh.p);
  preview.visible = true;
}

// ══ MATE ═════════════════════════════════════════════════════════════════
// ⭐⭐ JOE, 2026-08-20: *"Can you add a mate command? I press mate and then
//    click two faces, and boom, they go together regardless of where they
//    are."* And: *"that might even be useful when we have the VR rig."*
//
// ⭐ IT IS NOT SNAP. Snap needs the two things to already be close - it makes
//    "nearly touching" into "touching". MATE WORKS AT ANY DISTANCE, which is a
//    genuinely different verb and the reason it earns its own slot.
//
// ⛔⛔ AND IT BENDS HIS OWN RULE, SO SAY SO OUT LOUD. "No modes" has held since
//    the first hour. Press-then-click-two-things IS a mode.
// ⭐⭐ WHAT SAVES IT: THE RULE WAS NEVER ABOUT MODES, IT WAS ABOUT HOLDING.
//    He cannot hold a key, so nothing may depend on a hand staying clamped.
//    But PICKING A TOOL UP is not holding - the button stays lit, the face
//    stays marked, and there is nothing invisible to remember. That is the
//    kid's-toolbox metaphor doing exactly what it was for.
// ⭐ AND IT IS WHY HE IS RIGHT ABOUT GOGGLES: in VR you do not press mate, you
//    PICK UP the mate tool and touch two faces. The gesture is already the
//    right shape for hands - this is the mouse translation of it, not the
//    other way round.
//
// ⚠️ WHAT IT HONESTLY CANNOT DO: rotate. Nothing in this tool rotates yet, so
//    two faces that are not on the same axis cannot be brought parallel. ⭐ So
//    mate reads B'S face as the truth and seats A flush against it, centred.
//    That is coincident-plus-two-centres, which is what he described, and it
//    never leaves one solid buried inside another.
const mark = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
  new THREE.MeshBasicMaterial({ color:0x9ad1ff, transparent:true, opacity:0.35,
                                side:THREE.DoubleSide, depthTest:false }));
mark.renderOrder = 997; mark.visible = false; scene.add(mark);

let mateA = null, mateBtn = null, mateHeld = false;

// ⭐⭐ THE COMPLAINT THAT MATTERED MOST, 2026-08-20: *"it doesn't really show
//    anything happening. It doesn't actually drag, so I can't tell that I am
//    actually doing the right thing."*
// ⛔ A DRAG SHOWS YOU THE ANSWER WHILE YOU DECIDE. Two clicks show you nothing
//    until it is already done - which means the only way to find out whether he
//    aimed right is to do it and look. That is a tool asking him to guess.
// ⭐⭐ SO THE PREVIEW IS THE FEATURE, NOT THE POLISH. Hover a face and the part
//    is drawn where it WOULD land, in outline, before anything moves. The
//    two-click gesture stops being blind and starts being a decision he can see.
const preview = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1)),
  new THREE.LineBasicMaterial({ color:0x9ad1ff, transparent:true, opacity:0.95,
                                depthTest:false }));
preview.renderOrder = 999; preview.visible = false; scene.add(preview);

// the candidate face under his cursor, fainter than the one he has committed to
const mark2 = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
  new THREE.MeshBasicMaterial({ color:0x9ad1ff, transparent:true, opacity:0.16,
                                side:THREE.DoubleSide, depthTest:false }));
mark2.renderOrder = 996; mark2.visible = false; scene.add(mark2);

// ⭐ ONE SHAPE OF ANSWER FOR BOTH KINDS. A box face and a cylinder's flat end
//    are the same thing to this verb: an axis and a side.
function faceOf(h) {
  if (!h) return null;
  if (h.sh.kind === 'box' && h.type === 'face')
    return { sh:h.sh, ax:h.axis, sgn:h.sign };
  if (h.sh.kind === 'cyl' && h.type === 'length')
    return { sh:h.sh, ax:h.sh.axis, sgn:h.sign };
  return null;                       // a barrel is not a face. Keep waiting.
}

function markFace(f, m) {
  m = m || mark;
  if (!f) { m.visible = false; return; }
  const e = ext(f.sh);
  const sz = new THREE.Vector3().subVectors(e.max, e.min);
  const c = new THREE.Vector3().addVectors(e.max, e.min).multiplyScalar(0.5);
  c[f.ax] = (f.sgn > 0 ? e.max[f.ax] : e.min[f.ax]) + 0.4 * f.sgn;
  m.geometry.dispose();
  m.rotation.set(0, 0, 0);
  if (f.ax === 'x') { m.geometry = new THREE.PlaneGeometry(sz.z, sz.y); m.rotation.y = Math.PI/2; }
  else if (f.ax === 'y') { m.geometry = new THREE.PlaneGeometry(sz.x, sz.z); m.rotation.x = Math.PI/2; }
  else { m.geometry = new THREE.PlaneGeometry(sz.x, sz.y); }
  m.position.copy(c);
  m.visible = true;
}

// ⭐ the move is worked out once and used twice - to DRAW the preview and to
//    DO the mate. ⛔ Two copies of this arithmetic would drift, and the day
//    they drift the preview lies, which is worse than having no preview.
function mateMove(a, b) {
  const ax = b.ax, sgn = b.sgn;
  const eb = ext(b.sh), ea = ext(a.sh);
  const move = new THREE.Vector3();
  move[ax] = (sgn > 0 ? eb.max[ax] - ea.min[ax] : eb.min[ax] - ea.max[ax]);
  AX.forEach(x => { if (x !== ax) move[x] = b.sh.p[x] - a.sh.p[x]; });
  return move;
}

function showPreview(b) {
  if (!mateA || !b || b.sh === mateA.sh) {
    preview.visible = false; mark2.visible = false; return;
  }
  markFace(b, mark2);
  const move = mateMove(mateA, b);
  const e = ext(mateA.sh);
  const sz = new THREE.Vector3().subVectors(e.max, e.min);
  preview.scale.set(Math.max(sz.x, 0.01), Math.max(sz.y, 0.01), Math.max(sz.z, 0.01));
  preview.position.addVectors(e.min, e.max).multiplyScalar(0.5).add(move);
  preview.visible = true;
}

function dropTool() {
  mateA = null;
  mateHeld = false;
  turnHeld = false;
  if (turnBtn) turnBtn.classList.remove('held');
  turnBtn = null;
  mark.visible = false;
  mark2.visible = false;
  preview.visible = false;
  if (mateBtn) mateBtn.classList.remove('held');
  mateBtn = null;
}

// ⭐ A MOVES TO B. He points at what he wants to move, then at where it goes -
//    the same order as saying it out loud, and the only order that does not
//    need a rule to remember.
function doMate(a, b) {
  const move = mateMove(a, b);     // ⭐ the same line the preview drew

  // ⛔ THE WHOLE CREW TRAVELS. A rigid translation keeps every weld fraction
  //    intact, so a mated hammer arrives assembled rather than in pieces.
  crewOf(a.sh).forEach(o => { o.p.add(move); o.mesh.position.copy(o.p); });
  refreshWelds();
}

// ══ SNAP ═════════════════════════════════════════════════════════════════
// ⭐⭐ HIS SMARTMATES INSTINCT, AND IT BELONGS HERE MORE THAN IN SOLIDWORKS.
//    Joe, 2026-08-20: *"when two planes get close together they kind of snap
//    together... I could position the cylinder, and when I got close to the
//    center axis or the symmetrical plane of each face, it would kind of light
//    up so I knew to stop it there."*
//
// ⭐ ROUGH PLACEMENT IS ILLEGIBLE WITHOUT IT. Everything sits slightly
//    floating and he cannot tell whether he meant it. A snap is what turns
//    "nearly touching" into "touching".
//
// ⛔ IT PROPOSES, IT DOES NOT DECIDE. A snap that overrides him is the tool
//    fighting him - the one thing he tests everything against. It shows the
//    alignment it thinks he wants; carrying on past it lets go, and no key is
//    held to escape it, because he cannot hold a key.
//
// ⭐⭐ THE HARD PART WAS NEVER THE MATHS. Every shape already knows where its
//    own middle is, so "am I near that centreline" is a subtraction. The hard
//    part is WHICH of the twenty possible alignments he meant - which is why
//    showing it first is not a nicety, it is the answer.
const snapLines = new THREE.LineSegments(new THREE.BufferGeometry(),
  new THREE.LineBasicMaterial({ color:0x9ad1ff, transparent:true, opacity:0.9,
                                depthTest:false }));
snapLines.renderOrder = 994; snapLines.visible = false; scene.add(snapLines);

const AX = ['x', 'y', 'z'];

// ⭐ Axis-aligned extents. Everything in this tool is axis-aligned so far, and
//    the day something is rotated this is the function that has to grow up.
function ext(sh) {
  if (sh.kind === 'box') {
    const h = sh.s.clone().multiplyScalar(0.5);
    return { min: sh.p.clone().sub(h), max: sh.p.clone().add(h) };
  }
  const av = axisVec(sh.axis);
  const u = new THREE.Vector3(av.y, av.z, av.x);
  const v = new THREE.Vector3().crossVectors(av, u);
  const ra = Math.max(sh.a0, sh.a1), rb = Math.max(sh.b0, sh.b1);
  const half = av.clone().multiplyScalar(sh.h / 2)
    .add(new THREE.Vector3(Math.abs(u.x)*ra, Math.abs(u.y)*ra, Math.abs(u.z)*ra))
    .add(new THREE.Vector3(Math.abs(v.x)*rb, Math.abs(v.y)*rb, Math.abs(v.z)*rb));
  return { min: sh.p.clone().sub(half), max: sh.p.clone().add(half) };
}

function proposeSnap(sh, skip) {
  const me = ext(sh);
  const tol = Math.max(4, radius() * 0.055);
  let best = null;

  SHAPES.forEach(other => {
    if (other === sh) return;
    if (skip && skip.indexOf(other) >= 0) return;   // ⛔ never snap to my own crew
    const it = ext(other);

    AX.forEach(A => {
      // ⭐ FACE TO FACE: my low side against its high side, or the reverse.
      [[me.min[A] - it.max[A], -1], [it.min[A] - me.max[A], 1]].forEach(([gap, sgn]) => {
        if (Math.abs(gap) > tol) return;
        // the other two axes must actually overlap, or this is two things
        // passing in the night rather than a face meeting a face
        const rest = AX.filter(x => x !== A);
        const touching = rest.every(B =>
          Math.min(me.max[B], it.max[B]) - Math.max(me.min[B], it.min[B]) > -tol);
        if (!touching) return;

        const move = new THREE.Vector3();
        move[A] = -gap * sgn * -1;            // close the gap exactly
        const marks = [{ type:'face', A, at: sgn > 0 ? it.min[A] : it.max[A], other }];

        // ⭐ AND WHILE WE ARE HERE, CENTRE IT. A post landing on a base wants
        //    the middle of the base, and that is the snap he described.
        rest.forEach(B => {
          const d = other.p[B] - sh.p[B];
          if (Math.abs(d) < tol * 1.6) {
            move[B] = d;
            marks.push({ type:'centre', A:B, other });
          }
        });

        const cost = move.length();
        if (!best || cost < best.cost) best = { move, marks, cost };
      });
    });
  });
  return best;
}

function showSnap(sh, prop) {
  if (!prop) { snapLines.visible = false; return; }
  const me = ext(sh);
  const pts = [];
  prop.marks.forEach(m => {
    const it = ext(m.other);
    if (m.type === 'face') {
      // the rectangle where the two faces actually meet
      const rest = AX.filter(x => x !== m.A);
      const lo = {}, hi = {};
      rest.forEach(B => {
        lo[B] = Math.max(me.min[B] + prop.move[B], it.min[B]);
        hi[B] = Math.min(me.max[B] + prop.move[B], it.max[B]);
      });
      const [B, C] = rest;
      const corner = (b, c) => {
        const v = new THREE.Vector3();
        v[m.A] = m.at; v[B] = b ? hi[B] : lo[B]; v[C] = c ? hi[C] : lo[C];
        return v;
      };
      const p00 = corner(0,0), p10 = corner(1,0), p11 = corner(1,1), p01 = corner(0,1);
      pts.push(p00,p10, p10,p11, p11,p01, p01,p00);
    } else {
      // a line straight through both middles, so the alignment is visible
      const a = m.other.p.clone(), b = m.other.p.clone();
      const span = Math.max(radius() * 0.5, 20);
      a[m.A] -= span; b[m.A] += span;
      pts.push(a, b);
    }
  });
  if (!pts.length) { snapLines.visible = false; return; }
  const arr = new Float32Array(pts.length * 3);
  pts.forEach((v,i) => { arr[i*3]=v.x; arr[i*3+1]=v.y; arr[i*3+2]=v.z; });
  snapLines.geometry.dispose();
  snapLines.geometry = new THREE.BufferGeometry();
  snapLines.geometry.setAttribute('position', new THREE.BufferAttribute(arr,3));
  snapLines.visible = true;
}

// ══ WELD ═════════════════════════════════════════════════════════════════
// ⭐⭐ JOE ASKED FOR THIS AS A BUTTON: *"a weld button... it'll lock it in
//    place until I tell it to unweld."* ⛔ IT IS A CONSTRAINT, NOT A BOOLEAN.
//    Two shapes stay themselves and agree to travel together. A FUSE would
//    make one body, need real topology, and kill push-pull the same way a cut
//    would - which is why the design record has this rung marked CHEAP and
//    the cut rung marked as where the representation dies.
//
// ⭐ WHY IT IS A DELIBERATE ACT AND NOT AUTOMATIC. Welding whatever the snap
//    touched would have cost nothing and I nearly did it. ⛔ But he said "until
//    I TELL it to unweld" - he described an act, twice. Auto-welding would
//    make lining two things up and sticking them together the same gesture,
//    and then there is no way to only line them up.
//
// ⭐⭐ AND THE STATE HAS TO BE VISIBLE OR THE TOGGLE IS A TRAP. Drop the tool
//    on a loose shape and it welds; drop it on a welded one and it lets go.
//    That is only safe because the TACKS SHOW at every seam - he can see which
//    it is before he drops. A toggle over invisible state would be a mode.
const WELDS = [];                 // [i, j] index pairs into SHAPES, symmetric

const TACK_G = new THREE.SphereGeometry(1, 10, 8);
const TACK_M = new THREE.MeshBasicMaterial({ color:0xffb37a, depthTest:false });
const tacks  = new THREE.Group(); scene.add(tacks);

// ⭐ A GROUP IS NOT STORED, IT IS WALKED. Storing groups means keeping them in
//    step with the pairs; walking them means the pairs are the only truth.
//    Weld A to B and B to C and the whole chain comes along, for free.
function crewOf(sh) {
  const seed = SHAPES.indexOf(sh);
  if (seed < 0) return [sh];
  const seen = new Set([seed]), queue = [seed];
  while (queue.length) {
    const a = queue.pop();
    WELDS.forEach(([i, j]) => {
      const o = i === a ? j : (j === a ? i : -1);
      if (o >= 0 && !seen.has(o)) { seen.add(o); queue.push(o); }
    });
  }
  return [...seen].map(i => SHAPES[i]).filter(Boolean);
}

// ⚠️ TOUCHING IS AXIS-ALIGNED BOX OVERLAP, like everything else here. It says
//    yes to a cylinder near a box corner that is not really touching. ⭐ That
//    is the RIGHT error for a brainstorming tool: welding one thing too many
//    is undone with one drop, and refusing to weld what he can see touching
//    would read as broken.
function touching(a, b) {
  if (a.neg || b.neg) return false;   // ⛔ you cannot weld to a hole
  const A = ext(a), B = ext(b);
  const tol = Math.max(3, radius() * 0.04);
  return AX.every(x => Math.min(A.max[x], B.max[x]) - Math.max(A.min[x], B.min[x]) > -tol);
}

function seamBox(a, b) {
  const A = ext(a), B = ext(b);
  const lo = new THREE.Vector3(), hi = new THREE.Vector3();
  AX.forEach(x => { lo[x] = Math.max(A.min[x], B.min[x]);
                    hi[x] = Math.min(A.max[x], B.max[x]); });
  return { lo, hi };
}

// ⭐ TACKS ALONG THE SEAM, not one dot at the middle. Three beads read as a
//    joint; one bead reads as a bug light. They sit where a welder would put
//    them, which is the whole reason he will know what they mean.
// ⭐ position-only moves skip rebuild() by design, so the hole's wall and the
//    uniforms have to be brought along by hand or the hole lags his cursor.
function syncCuts() {
  SHAPES.forEach(sh => { if (sh.wall) sh.wall.position.copy(sh.p); });
  refreshCuts();
}

function refreshWelds() {
  tacks.clear();
  const r = Math.max(1.1, radius() * 0.016);
  WELDS.forEach(([i, j]) => {
    const a = SHAPES[i], b = SHAPES[j];
    if (!a || !b) return;
    const { lo, hi } = seamBox(a, b);
    const mid = lo.clone().add(hi).multiplyScalar(0.5);
    // the longest direction of the overlap is the seam's run
    let run = 'x';
    AX.forEach(x => { if (hi[x] - lo[x] > hi[run] - lo[run]) run = x; });
    const span = Math.max(0, hi[run] - lo[run]);
    [-0.32, 0, 0.32].forEach(t => {
      const m = new THREE.Mesh(TACK_G, TACK_M);
      m.position.copy(mid); m.position[run] += span * t;
      m.scale.setScalar(r); m.renderOrder = 996;
      tacks.add(m);
    });
  });
}

// ⭐ ONE DROP, AND WHICH WAY IT GOES IS WHAT HE CAN ALREADY SEE.
// ⭐⭐ HIS SECOND FINDING, AND IT IS THE ONE THAT MAKES WELD MEAN SOMETHING:
//    *"even with the weld, let's say I go pull one side of the hammer. The
//    handle doesn't stay centered even after the weld."*
//
// ⛔ MY WELD ONLY HELD WHILE THINGS TRAVELLED. Change the head's SIZE and the
//    handle sat where it was, which is not a weld - that is a tow rope.
//
// ⭐⭐ AND THE FIX IS NOT "MOVE IT BY THE SAME DELTA" - I tried that on paper
//    and it fails his other case. Grow the head to the right, its centre moves
//    right by half, so a centre-delta keeps the handle centred. GOOD. But pull
//    the handle LONGER downward and its centre also moves down by half, so a
//    centre-delta drags the head down with it. WRONG - the top of the handle
//    never moved, so the head should not have.
//
// ⭐ WHAT ACTUALLY HOLDS IS THE FRACTION. Record where the partner sits inside
//    my box as a 0..1 position on each axis, at the moment of the weld. Then
//    whatever happens to my size, put it back at the same fraction.
//        handle at 0.5 of the head's width   -> still centred after it grows
//        head at 1.0 of the handle's length  -> still at the top after it grows
//    ⛔ BOTH of his cases, from one rule, and neither needed a special case.
// ⭐⭐ AND HIS OWN WORD FOR IT IS THE ONE THAT FIXES THE LAST GAP, 2026-08-20:
//    *"SOLIDWORKS would treat a midpoint constraint or a symmetrical constraint
//    no matter what I change to the hammer. The handle then would always remain
//    centered, and I would have to un-weld it to change that constraint."*
// ⛔ A RAW FRACTION CANNOT SAY "CENTRED". Weld the handle at 0.483 and it stays
//    at 0.483 forever - near enough to look right, never actually a midpoint,
//    and it drifts visibly the moment the head gets wide.
// ⭐ SO THE FRACTION SNAPS WHEN IT IS TAKEN: near the middle becomes exactly
//    the middle, near an end becomes exactly flush. THE WELD IS ROUNDED ONCE,
//    AT THE MOMENT HE MAKES IT, and after that it is exact forever. That is
//    the same instinct as the snap he asked for - "snap to symmetrical" - only
//    spent on the constraint instead of on the placement.
// ⛔⛔ MY FIRST VERSION STORED ONE FRACTION PER AXIS AND IT WAS WRONG IN A WAY
//    HIS HANDS FOUND IN A MINUTE: *"when I drag the hammer head taller, the
//    handle basically goes down into the material. It doesn't stay mated to
//    the surface."*
// ⭐⭐ HERE IS WHY, AND IT IS WORTH KEEPING. A fraction says where the guest's
//    CENTRE sits inside the host's box. But a welded part is not inside its
//    partner - IT IS ALONGSIDE IT. The handle's centre is BELOW the head, so
//    its fraction came out NEGATIVE, my rounding clamped it to 0, and 0 means
//    "centre on the host's bottom face" - which is exactly halfway buried.
//    ⛔ THE ROUNDING I ADDED TO MAKE MIDPOINTS EXACT IS WHAT DROVE IT INTO THE
//    STEEL. A tidy-up on a model that was already wrong.
//
// ⭐⭐ A WELD IS TWO DIFFERENT THINGS AT ONCE AND THEY NEED DIFFERENT RULES:
//      ACROSS the joint   - stay FLUSH. An offset, held against the face,
//                           however either part grows. This is the mate.
//      ALONG the joint    - stay at the same FRACTION. Middle stays middle.
//                           This is the midpoint constraint he named.
//    ⛔ One rule for both was the error. The contact axis is worked out once,
//    when he welds, from whichever pair of faces is actually touching.
function relOf(host, guest) {
  const h = ext(host), g = ext(guest);
  let ax = 'y', sgn = 1, best = Infinity;
  AX.forEach(x => {
    const above = Math.abs(g.min[x] - h.max[x]);     // guest on the + side
    const below = Math.abs(h.min[x] - g.max[x]);     // guest on the - side
    if (above < best) { best = above; ax = x; sgn = 1; }
    if (below < best) { best = below; ax = x; sgn = -1; }
  });
  const f = {};
  AX.forEach(x => {
    if (x === ax) return;
    const span = h.max[x] - h.min[x];
    let v = span > 1e-6 ? (guest.p[x] - h.min[x]) / span : 0.5;
    // ⭐ round ONLY along the joint, where a fraction is the right idea
    if (Math.abs(v - 0.5) < 0.06) v = 0.5;
    else if (Math.abs(v) < 0.06) v = 0;
    else if (Math.abs(v - 1) < 0.06) v = 1;
    f[x] = v;
  });
  return { ax, sgn, f };
}

function placeByRel(host, guest, r) {
  const h = ext(host), g = ext(guest);
  const half = (g.max[r.ax] - g.min[r.ax]) / 2;
  // across: seated on the face, never in it
